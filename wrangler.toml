name = "listas"
main = "src/index.js"
compatibility_date = "2026-07-01"
keep_vars = true
# Serve os arquivos de public/ (html, css, imagens) como assets estáticos.
# Requisições que baterem em um arquivo aqui são respondidas direto,
# sem nem passar pelo código do Worker.
[assets]
directory = "public"
binding = "ASSETS"

# Binding do KV que guarda os usuários (configurado no dashboard da Cloudflare
# em Workers & Pages -> listas -> Settings -> Bindings).
[[kv_namespaces]]
binding = "USERS_KV"
id = "a3ce11ad984a45a1b7aa5d4d5a45fd5d"

# Binding do KV que guarda os .json das listas — separado do USERS_KV de
# propósito, pra não misturar dados de login com os arquivos salvos.
# Depois de criar o namespace "listas" no painel da Cloudflare (veja o
# README, seção "Salvar e carregar listas"), troque o id abaixo pelo ID que
# a Cloudflare gerar para ele.
[[kv_namespaces]]
binding = "LISTAS_KV"
id = "d8dd62c8775e48f986bbea8ec85524e1"

# Lista de Presença Musical "ao vivo": várias pessoas fazendo a chamada ao mesmo tempo
# (src/sala-presenca.js). É um Durable Object com SQLite — funciona no plano gratuito
# e é criado sozinho no deploy; não precisa criar nada no painel.
[[durable_objects.bindings]]
name = "SALA_PRESENCA"
class_name = "SalaPresencaMusical"

[[migrations]]
tag = "v1-sala-presenca"
new_sqlite_classes = ["SalaPresencaMusical"]

# As variáveis abaixo são SECRETS (não coloque valores aqui no arquivo).
# Depois do primeiro deploy, defina cada uma com:
#   wrangler secret put SESSION_SECRET
