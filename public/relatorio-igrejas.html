<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
/* Acesso: quem tem a lista de uma região edita o relatório de igrejas dessa região. */
(function () {
  document.documentElement.style.visibility = 'hidden';
  var token = localStorage.getItem('session_token');
  if (!token) { window.location.replace('/login.html'); return; }
  fetch('/api/verify-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.ok) {
      window.__SESSAO = data;
      document.documentElement.style.visibility = 'visible';
      var lists = Array.isArray(data.lists) ? data.lists : [];
      function montarBarraTopo() {
        var bar = document.createElement('div');
        bar.style.cssText = 'position:absolute; top:12px; right:12px; z-index:99999; display:flex; gap:8px;';
        var backBtn = document.createElement('a');
        backBtn.href = data.role === 'admin' ? '/admin-listas.html' : '/minhas-listas.html';
        backBtn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"></use></svg>Voltar'; backBtn.className = 'topnav-btn';
        backBtn.style.cssText = 'background:#fff; color:#1b2a41; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; border:1.5px solid #e4dcc9;';
        bar.appendChild(backBtn);
        var sairBtn = document.createElement('a');
        sairBtn.href = '#';
        sairBtn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-logout"></use></svg>Sair'; sairBtn.className = 'topnav-btn';
        sairBtn.style.cssText = 'background:linear-gradient(180deg,#2c3f5c,#1b2a41); color:#fdfbf6; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; border:1.5px solid #1b2a41;';
        sairBtn.onclick = function (e) { e.preventDefault(); localStorage.removeItem('session_token'); window.location.href = '/login.html'; };
        bar.appendChild(sairBtn);
        document.body.appendChild(bar);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', montarBarraTopo); else montarBarraTopo();
      if (window.__aoEntrar) window.__aoEntrar(data);
    } else {
      localStorage.removeItem('session_token');
      window.location.replace('/login.html');
    }
  }).catch(function () { window.location.replace('/login.html'); });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Igrejas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#1b2a41;--primary-2:#2c3f5c;--brass:#a97d3d;--brass-lt:#c99a55;--accent:#b04b3c;--bg:#f5f1e8;--line:#e4dcc9;--ink:#24304a;--muted:#7a7263;--ok:#3d7a57}
*{box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink)}
header{position:relative;padding:16px 200px 16px 22px;background:linear-gradient(180deg,var(--primary-2),var(--primary));color:#fdfbf6}
header h1{margin:0;font-size:19px;font-family:'Fraunces',Georgia,serif;font-weight:600}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
button{cursor:pointer;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--primary);padding:8px 13px;border-radius:9px;font-size:13px;display:inline-flex;align-items:center;gap:7px;font-family:inherit;transition:background-color .15s,border-color .15s,box-shadow .15s,color .15s}
button:hover{border-color:var(--brass-lt)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button.primary{background:linear-gradient(180deg,#34496a,var(--primary));color:#fdfbf6;border-color:transparent;box-shadow:0 8px 18px -10px rgba(27,42,65,.7),inset 0 1px 0 rgba(255,255,255,.18)}
button.primary:hover{background:linear-gradient(180deg,#3d5478,#22344f)}
button.danger{color:var(--accent)}
button svg.ic{width:16px;height:16px;flex:none}
input,select,textarea{border:1.5px solid #e2d9c4;border-radius:9px;padding:8px 10px;font-size:14px;width:100%;background:#fffdf8;color:var(--ink);font-family:inherit;transition:border-color .15s,box-shadow .15s,background-color .15s}
input:hover,select:hover,textarea:hover{border-color:#d3c4a2}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--brass);box-shadow:0 0 0 3.5px rgba(169,125,61,.17)}
input::placeholder,textarea::placeholder{color:#b3aa95}
textarea{resize:vertical;min-height:74px;line-height:1.5}
label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8f846b;display:block;margin:0 0 4px}

/* barra de cima */
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:rgba(250,246,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid #ebe3cf;box-shadow:0 8px 20px -18px rgba(27,42,65,.6)}
.regs{display:flex;gap:4px;background:#ece6d6;padding:4px;border-radius:11px;flex-wrap:wrap}
.regs button{border:none;background:transparent;padding:7px 13px;font-size:13.5px;color:#6d6652;border-radius:8px}
.regs button:hover{color:var(--primary)}
.regs button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(27,42,65,.18)}
.topo .esp{flex:1}
.estado{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.estado svg.ic{width:15px;height:15px;color:var(--ok);flex:none}
.estado b{color:var(--ok)}
.estado.pend b,.estado.pend svg.ic{color:#a46a12}
.estado.pend{background:#fdf3dc;border:1px solid #ecd49a;border-radius:999px;padding:5px 12px}
.menu{position:relative}
.menu-box{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(27,42,65,.45);padding:6px;z-index:40}
.menu.open .menu-box{display:block}
.menu-box button{width:100%;border:none;justify-content:flex-start;padding:9px 12px;font-size:14px;border-radius:8px;gap:10px}
.menu-box button svg.ic{color:var(--brass)}
.menu-box button:hover{background:#f6f1e4}
.menu-box hr{border:none;border-top:1px solid var(--line);margin:5px 4px}

.miolo{max-width:1500px;margin:0 auto;padding:16px 18px 40px}

/* resumo da região */
.painel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(27,42,65,.04);text-align:left;min-width:0}
.tile .ti{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--brass);background:linear-gradient(180deg,#f6ecd6,#ecdcb4)}
.tile .ti svg.ic{width:19px;height:19px}
.tile b{display:block;font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;line-height:1;color:var(--primary)}
.tile span{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.dark{background:linear-gradient(115deg,#15233a,#2f4566);border-color:transparent;box-shadow:0 12px 26px -16px rgba(27,42,65,.8)}
.tile.dark .ti{background:rgba(255,255,255,.12);color:#e9cf9c}
.tile.dark b{color:#fdfbf6}.tile.dark span{color:#cfd8e5}
button.tile{cursor:pointer;font-weight:inherit}
button.tile.aviso .ti{background:linear-gradient(180deg,#fdeccb,#f6d99c);color:#a46a12}
button.tile.tudo-ok .ti{background:linear-gradient(180deg,#e3f1e7,#cfe6d6);color:var(--ok)}
button.tile.on{border-color:#d9a94f;box-shadow:0 0 0 3px rgba(217,169,79,.25)}

/* corpo: lista de igrejas à esquerda, ficha à direita */
.corpo{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.lado{position:sticky;top:74px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(27,42,65,.04),0 18px 40px -26px rgba(27,42,65,.35)}
.lado-top{padding:12px;border-bottom:1px solid #efe8d6;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#fbf8f1,#f7f2e6)}
.lado-top .busca{position:relative}
.lado-top .busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#a39a85}
.lado-top .busca input{padding-left:35px;background:#fff}
.lado-top button.primary{justify-content:center;padding:10px}
.lado-top .resumo{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:16px}
.lado-top .resumo button{border:none;background:none;padding:0;font-size:12px;color:var(--brass);text-decoration:underline;text-underline-offset:2px}
.lista{overflow:auto;padding:4px 8px 12px}
.cid-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);padding:12px 6px 5px}
.cid-h::after{content:"";flex:1;height:1px;background:#efe8d6;order:1}
.cid-h em{order:2;font-style:normal;background:#f1ebdc;color:#7a6a45;border-radius:9px;padding:0 7px;line-height:18px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;width:100%;border:1px solid transparent;background:none;padding:9px 10px;border-radius:11px;text-align:left;font-weight:600;font-size:14px;color:var(--primary)}
.it:hover{background:#faf6ec;border-color:#efe8d6}
.it.on{background:linear-gradient(115deg,#15233a,#2c3f5c);color:#fdfbf6;border-color:transparent;box-shadow:0 10px 20px -14px rgba(27,42,65,.9)}
.it .it-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{grid-column:1;font-weight:500;font-size:12px;color:#8f846b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.on small{color:#cfd6e2}
.it .sem{grid-column:2;grid-row:1 / span 2;display:flex;gap:2px}
.sem i{font-style:normal;width:15px;height:18px;border-radius:5px;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#f3eee1;color:#c3b99f}
.sem i.s{background:var(--brass);color:#fff}
.it.on .sem i{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35)}
.it.on .sem i.s{background:#e0bd84;color:#1b2a41}
.it .falta{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9972b;margin-left:6px;vertical-align:1px}
.vazio{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px}

/* ficha */
.ficha{display:flex;flex-direction:column;gap:14px}
.heroi{position:relative;overflow:hidden;border-radius:16px;padding:18px 20px 16px;color:#fdfbf6;background:linear-gradient(115deg,#15233a 0%,#22344f 55%,#2f4566 100%);box-shadow:0 18px 36px -22px rgba(27,42,65,.9)}
.heroi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#a97d3d,#e0bd84 50%,#a97d3d)}
.heroi::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.12) 1.3px,transparent 1.4px);background-size:20px 20px;-webkit-mask-image:radial-gradient(460px 200px at 100% 0%,#000 0%,transparent 72%);mask-image:radial-gradient(460px 200px at 100% 0%,#000 0%,transparent 72%)}
.heroi > *{position:relative;z-index:1}
.h-l1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h-tit{min-width:0}
.h-tit small{display:block;font-size:12px;font-weight:700;color:#e0bd84;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.h-tit h2{margin:0;font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.h-end{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13.5px;color:#cfd8e5}
.h-end svg.ic{width:15px;height:15px;color:#e0bd84;flex:none}
.h-acoes{display:flex;gap:6px;flex:none}
.h-acoes button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fdfbf6}
.h-acoes button:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.h-acoes button.danger:hover{background:#b04b3c;border-color:#b04b3c;color:#fff}
.heroi .h-volta{display:none}
.h-cultos{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.h-cultos span{display:inline-flex;align-items:baseline;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.h-cultos span b{color:#e9cf9c;font-weight:700}
.h-cultos span em{font-style:normal;font-weight:500;color:#cfd8e5;font-size:11.5px}
.h-cultos .nenhum{background:none;border-style:dashed;color:#cfd8e5;font-weight:500}
.h-prog{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#cfd8e5;flex-wrap:wrap}
.h-prog .barra{display:flex;gap:4px;flex:none}
.h-prog .barra i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
.h-prog .barra i.s{background:#e0bd84}
.h-prog b{color:#fdfbf6}
.h-prog.cheia .barra i.s{background:#7fc99b}

.cartoes{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.colm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
.bloco{container-type:inline-size;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;box-shadow:0 1px 2px rgba(27,42,65,.04),0 14px 30px -26px rgba(27,42,65,.4)}
.bloco.larg{flex:1 1 100%}
.bloco h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15.5px;color:var(--primary)}
.bloco h3 .bi{flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--brass);background:linear-gradient(180deg,#f6ecd6,#ecdcb4)}
.bloco h3 .bi svg{width:17px;height:17px}
.bloco h3 small{font-weight:500;font-size:12px;color:var(--muted)}
.bloco h3 em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;color:#7a6a45;background:#f4eedf;border-radius:999px;padding:2px 10px;white-space:nowrap}
.bloco h3 em.zero{background:#fdf3dc;color:#a46a12}
.grid{display:grid;gap:12px}
.g-id{grid-template-columns:1fr 1fr}
.g-id > :nth-child(3){grid-column:1}
.g-end{grid-template-columns:1fr}
.g-2{grid-template-columns:1fr 1fr}
.sub-t{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8f846b}
.sub-t::after{content:"";flex:1;height:1px;background:#efe8d6}
/* linhas de culto / ensaio */
.linhas{display:flex;flex-direction:column;gap:6px}
.lc{display:grid;grid-template-columns:130px 130px 112px minmax(0,1fr) 34px;gap:8px;align-items:center}
.le{display:grid;grid-template-columns:110px 130px 112px minmax(0,1fr) 34px;gap:8px;align-items:center}
.lc-cab,.le-cab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9a8f76}
@container (max-width:600px){
  .lc,.le{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;padding:8px;border:1px solid #efe8d6;border-radius:11px;background:#fdfbf6}
  .lc>:nth-child(3),.le>:nth-child(3){grid-column:1}
  .lc>:nth-child(4),.le>:nth-child(4){grid-column:2 / -1}
  .lc>:nth-child(5),.le>:nth-child(5){grid-column:3;grid-row:1}
  .lc-cab,.le-cab{display:none}
}
@container (max-width:420px){ .g-2,.g-id{grid-template-columns:1fr} .g-id > :nth-child(3){grid-column:auto} }
.x{width:34px;height:34px;padding:0;justify-content:center;border-color:transparent;color:#a39a85;background:transparent}
.x:hover{color:var(--accent);background:#fbeae4;border-color:#efc7bd}
.mais{border-style:dashed;border-color:#d9cba6;background:#fdfbf6;color:#6d5a2c;font-size:13px;padding:8px 12px;align-self:stretch;justify-content:center}
.mais:hover{background:#f7f0df;border-style:solid}
/* listas de nomes */
.nomes{display:flex;flex-direction:column;gap:5px}
.nomes .ni{display:flex;gap:4px}
.nomes .ni input{flex:1;min-width:0}
.nomes .ni button{width:34px;height:34px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:#a39a85;flex-shrink:0}
.nomes .ni button.add{color:var(--brass)}
.nomes .ni button.add:hover{color:#fff;background:var(--brass)}
.nomes .ni button.rem:hover{color:var(--accent);background:#fbeae4}
.vazia-ficha{text-align:center;padding:64px 20px;color:var(--muted);background:linear-gradient(180deg,#fdfbf6,#f8f3e7);border:1.5px dashed #dccfae;border-radius:16px;font-size:14px;line-height:1.5}
.vazia-ficha .vi{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--brass);background:linear-gradient(180deg,#f6ecd6,#ecdcb4)}
.vazia-ficha .vi svg{width:28px;height:28px}
.vazia-ficha b{display:block;font-size:19px;color:var(--primary);margin-bottom:6px;font-family:'Fraunces',Georgia,serif;font-weight:600}
.vazia-ficha button{margin-top:16px;padding:10px 18px;font-size:14px}
.dica{font-size:12.5px;color:var(--muted);margin:2px 0 4px}

.vis{display:inline-flex;gap:4px;background:#ece6d6;padding:4px;border-radius:10px;margin:0 0 12px}
.vis[hidden]{display:none}
.vis button{border:none;background:transparent;box-shadow:none;padding:7px 14px;font-size:13px;color:#6d6652;border-radius:8px}
.vis button svg.ic{width:15px;height:15px}
.vis button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(27,42,65,.18)}
body.v-geral .corpo{display:none}
.tab{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 14px 30px -26px rgba(27,42,65,.5);font-size:13.5px;color:var(--ink)}
.tab th{background:var(--primary);color:#e9d9b4;font-size:11px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:11px 14px;font-weight:700}
.tab td{padding:10px 14px;border-top:1px solid #efe8d7;vertical-align:top}
.tab tr.cid td{background:#f6f0e1;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--brass);text-transform:uppercase;padding:7px 14px}
.tab tr.ig{cursor:pointer}
.tab tr.ig:hover td{background:#fbf7ec}
.tab tr.ig:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.tab td b{font-weight:650;color:var(--primary)}
.tab td small{display:block;color:#8a8371;font-size:12px;margin-top:1px}
.tab .ch{display:inline-block;background:#f1ebdc;border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;font-size:12px;white-space:nowrap}
.tab .ch b{color:var(--brass);margin-right:4px}
.tab .ch em{font-style:normal;color:#8a8371;margin-left:4px}
.tab .fa{color:var(--accent);font-weight:600;font-size:12px}
.tab .tr{color:#b9b19c}
.geral-vazio{padding:34px 18px;text-align:center;color:var(--muted);background:#fff;border:1.5px dashed #dccfae;border-radius:16px}
@media (max-width:1180px){
  .painel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cartoes{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  .colm{display:contents}
  .colm.a > :nth-child(1){order:1}.colm.b > :nth-child(1){order:2}.colm.a > :nth-child(2){order:3}.colm.b > :nth-child(2){order:4}.bloco.larg{order:5;flex:none}
}
@media (max-width:980px){
  header{padding:64px 16px 14px}
  .topo{position:static;padding:8px 10px;gap:8px}
  .regs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
  .regs::-webkit-scrollbar{display:none}
  .regs button{flex:none;white-space:nowrap;padding:9px 14px}
  .topo .esp{display:none}
  .estado{flex:1;min-width:0;font-size:12px}
  .estado span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .estado.pend{padding:5px 10px}

<body>

      <button type="button" id="btnNuvemCarregar" onclick="carregarNuvem(true)"><svg class="ic"><use href="/assets/icons.svg#i-cloud-down"></use></svg>Recarregar da nuvem</button>
      <hr>

<script src="/assets/ui.js"></script>
<script>
/* =====================================================================
   Relatório de Igrejas — um por região.
   Dados: { regiao, igrejas:[{ id, cidade, nome, codigo, endereco,
            cultos:[{dia, hora, tipo, obs}],
            anciaes:[], diaconos:[], coopOficio:[], coopJovens:[],
            encLocais:[], encRegionais:[], examinadoras:[],
            ensaios:[{semana, dia, hora, obs}], obs }], atualizado }
   Neste aparelho: localStorage 'ccb_igrejas_<regiao>'.
   Na nuvem: arquivo "_igrejas" da região (o "_" esconde ele das listas).
   ===================================================================== */
const REGIOES = { campomourao:'Campo Mourão', cianorte:'Cianorte', ubirata:'Ubiratã', pitanga:'Pitanga', goioere:'Goioerê', ivaipora:'Ivaiporã' };
const ARQ_NUVEM = '_igrejas';
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const TIPOS_CULTO = ['Culto','RJM','Culto de Jovens','Santa Ceia','Outro'];
const SEMANAS = ['Todo','1º','2º','3º','4º','5º','Último'];
const MINISTERIO = [
  ['anciaes','Anciães','Ancião'], ['diaconos','Diáconos','Diácono'],
  ['coopOficio','Cooperadores do Ofício Ministerial','Cooperador'], ['coopJovens','Cooperadores de Jovens e Menores','Cooperador']
];
const MUSICA = [
  ['encLocais','Encarregados Locais','Encarregado'], ['encRegionais','Encarregados Regionais','Encarregado'], ['examinadoras','Examinadoras','Examinadora']
];
const ICO = n => `<svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-${n}"></use></svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const novoId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let REG = null;            // região aberta
let DADOS = null;          // { regiao, igrejas:[...], atualizado }
let SEL = null;            // id da igreja aberta
let NUVEM_EM = null;       // quando a nuvem foi atualizada (ms)
let PENDENTE = false;      // há mudança não enviada para a nuvem

function chaveLocal(r){ return 'ccb_igrejas_' + r; }
function vazio(r){ return { regiao:r, igrejas:[], atualizado:0 }; }
function ler(r){ try { const t = localStorage.getItem(chaveLocal(r)); if (t) return normalizar(JSON.parse(t), r); } catch(e){} return vazio(r); }
function normalizar(d, r){
  d = d && typeof d === 'object' ? d : {};
  const lista = Array.isArray(d.igrejas) ? d.igrejas : [];
  return { regiao: r, atualizado: d.atualizado || 0, igrejas: lista.map(i => Object.assign({
    id: novoId(), cidade:'', nome:'', codigo:'', endereco:'', cultos:[], anciaes:[], diaconos:[], coopOficio:[], coopJovens:[],
    encLocais:[], encRegionais:[], examinadoras:[], ensaios:[], obs:''
  }, i)) };
}
let _tSalvar = null;
function guardar(){
  DADOS.atualizado = Date.now();
  PENDENTE = true;
  clearTimeout(_tSalvar);
  agendarRefresco();
  _tSalvar = setTimeout(()=>{ try { localStorage.setItem(chaveLocal(REG), JSON.stringify(DADOS)); localStorage.setItem(chaveLocal(REG)+'_pend','1'); } catch(e){} mostrarEstado(); }, 250);
}
function mostrarEstado(){
  const el = document.getElementById('estado');
  const q = ms => { if (!ms) return ''; const d = new Date(ms); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
  el.className = 'estado' + (PENDENTE ? ' pend' : '');
  el.innerHTML = PENDENTE
    ? `${ICO('alert')}<span><b>Alterações só neste aparelho</b> — salve na nuvem para todos verem</span>`
    : `${ICO('check-circle')}<span><b>Em dia com a nuvem</b>${NUVEM_EM ? ' · ' + q(NUVEM_EM) : ''}</span>`;
}

/* ---------- nuvem ---------- */
async function api(rota, corpo){
  const res = await fetch('/api/' + rota, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ token: localStorage.getItem('session_token'), regiao: REG }, corpo || {})) });
  let d = {}; try { d = await res.json(); } catch(e){}
  if (!res.ok) throw new Error(d.error || 'Erro de comunicação com o servidor');
  return d;
}
async function salvarNuvem(){
  const btn = document.getElementById('btnNuvemSalvar');
  const fim = UI.busy ? UI.busy(btn, 'Salvando...') : ()=>{};
  try {
    await api('lista-save', { nome: ARQ_NUVEM, conteudo: JSON.stringify(DADOS) });
    PENDENTE = false; NUVEM_EM = Date.now();
    try { localStorage.removeItem(chaveLocal(REG)+'_pend'); } catch(e){}
    mostrarEstado();
    UI.toast(`Relatório de ${REGIOES[REG]} salvo na nuvem.`, 'ok');
  } catch(e){ UI.toast('Não foi possível salvar na nuvem: ' + e.message, 'error'); }
  finally { fim(); }
}
// manual: pergunta antes de trocar o que está na tela
async function carregarNuvem(manual){
  try {
    const lst = (await api('lista-list')).arquivos || [];
    const arq = lst.find(a => a.nome === ARQ_NUVEM + '.json');
    if (!arq){ if (manual) UI.toast(`Ainda não há relatório de ${REGIOES[REG]} salvo na nuvem.`, 'info'); NUVEM_EM = null; mostrarEstado(); return; }
    NUVEM_EM = arq.modificado || null;
    const pend = (()=>{ try { return localStorage.getItem(chaveLocal(REG)+'_pend')==='1'; } catch(e){ return false; } })();
    if (pend && !manual){ PENDENTE = true; mostrarEstado(); return; } // não passa por cima do que ainda não foi enviado
    if (manual && pend){
      const ok = await UI.confirm('Trocar pelo que está na nuvem?', 'Este aparelho tem alterações que ainda não foram salvas na nuvem. Elas serão substituídas.', { ok:'Trocar', danger:true });
      if (!ok) return;
    }
    const d = await api('lista-load', { nome: ARQ_NUVEM + '.json' });
    const antes = JSON.stringify(DADOS);
    DADOS = normalizar(typeof d.conteudo === 'string' ? JSON.parse(d.conteudo) : d.conteudo, REG);
    try { localStorage.setItem(chaveLocal(REG), JSON.stringify(DADOS)); localStorage.removeItem(chaveLocal(REG)+'_pend'); } catch(e){}
    PENDENTE = false;
    if (!DADOS.igrejas.some(i=>i.id===SEL)) SEL = DADOS.igrejas[0] ? DADOS.igrejas[0].id : null;
    desenharTudo();
    if (manual) UI.toast('Relatório recarregado da nuvem.', { type:'ok', action:{ label:'Desfazer', icon:'undo', fn:()=>{ DADOS = normalizar(JSON.parse(antes), REG); guardar(); desenharTudo(); } } });
  } catch(e){ if (manual) UI.toast('Não foi possível acessar a nuvem: ' + e.message, 'error'); }
  mostrarEstado();
}

/* ---------- backup ---------- */
function baixarBackup(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DADOS, null, 2)], {type:'application/json'}));
  a.download = `relatorio_igrejas_${REG}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function abrirBackup(ev){
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const antes = JSON.stringify(DADOS);
    DADOS = normalizar(JSON.parse(r.result), REG); guardar(); SEL = DADOS.igrejas[0] ? DADOS.igrejas[0].id : null; desenharTudo();
    UI.toast('Backup aberto.', { type:'ok', action:{ label:'Desfazer', icon:'undo', fn:()=>{ DADOS = normalizar(JSON.parse(antes), REG); guardar(); desenharTudo(); } } });
  } catch(e){ UI.toast('Arquivo inválido.', 'error'); } };
  r.readAsText(f); ev.target.value = '';
}

/* ---------- menus ---------- */
function togMenu(ev, id){ ev.stopPropagation(); document.getElementById(id).classList.toggle('open'); }
document.addEventListener('click', e=>{ document.querySelectorAll('.menu.open').forEach(m=>{ if (!m.contains(e.target) || e.target.closest('.menu-box button')) m.classList.remove('open'); }); });

/* ---------- ordem e lista lateral ---------- */
function ordenar(){
  const ch = s => String(s||'').trim().toLowerCase();
  DADOS.igrejas.sort((a,b)=> ch(a.cidade).localeCompare(ch(b.cidade),'pt-BR') || ((ch(b.nome)==='central') - (ch(a.nome)==='central')) || ch(a.nome).localeCompare(ch(b.nome),'pt-BR'));
}
function desenharRegioes(){
  const permitidas = regioesPermitidas();
  document.getElementById('regs').innerHTML = permitidas.map(r=>`<button type="button" role="tab" class="${r===REG?'on':''}" data-r="${r}">${esc(REGIOES[r])}</button>`).join('');
  document.querySelectorAll('#regs [data-r]').forEach(b=>b.onclick=()=>abrirRegiao(b.dataset.r));
}
/* ---------- o que já foi preenchido em cada ficha ---------- */
const INICIAIS = ['D','S','T','Q','Q','S','S'];
const DIA_CURTO = { Domingo:'Dom', Segunda:'Seg', 'Terça':'Ter', Quarta:'Qua', Quinta:'Qui', Sexta:'Sex', 'Sábado':'Sáb' };
const temNome = v => (v||[]).some(x => String(x||'').trim());
function partes(ig){
  return [
    ['código', !!String(ig.codigo||'').trim()],
    ['endereço', !!String(ig.endereco||'').trim()],
    ['cultos', (ig.cultos||[]).some(c => c.dia && c.hora)],
    ['ministério', MINISTERIO.some(([k]) => temNome(ig[k]))],
    ['parte musical', MUSICA.some(([k]) => temNome(ig[k])) || (ig.ensaios||[]).some(e => e.dia && e.hora)]
  ];
}
const incompleta = ig => partes(ig).some(p => !p[1]);
let SO_INCOMPLETAS = false;
function semanaHTML(ig){
  const tem = new Set((ig.cultos||[]).filter(c => c.hora).map(c => DIAS.indexOf(c.dia)));
  return '<span class="sem" aria-hidden="true">' + INICIAIS.map((l, n) => `<i class="${tem.has(n) ? 's' : ''}">${l}</i>`).join('') + '</span>';
}
function desenharPainel(){
  const host = document.getElementById('painel'); if (!host) return;
  const igs = DADOS.igrejas;
  const unicos = ch => new Set(igs.flatMap(i => (i[ch]||[]).map(x => String(x||'').trim().toLowerCase()).filter(Boolean))).size;
  const cidades = new Set(igs.map(i => (i.cidade||'').trim().toUpperCase()).filter(Boolean)).size;
  const horarios = igs.reduce((a, i) => a + (i.cultos||[]).filter(c => c.dia && c.hora).length, 0);
  const inc = igs.filter(incompleta).length;
  if (!inc) SO_INCOMPLETAS = false;
  const t = (ic, n, rot, cls) => `<div class="tile ${cls||''}"><span class="ti">${ICO(ic)}</span><div><b>${n}</b><span>${rot}</span></div></div>`;
  host.innerHTML =
    t('pin', igs.length, `${igs.length===1?'igreja':'igrejas'} em ${cidades} ${cidades===1?'cidade':'cidades'}`, 'dark') +
    t('users', unicos('anciaes'), 'anciães') +
    t('user', unicos('diaconos'), 'diáconos') +
    t('clock', horarios, 'horários de culto') +
    `<button type="button" class="tile ${inc ? 'aviso' : 'tudo-ok'}${SO_INCOMPLETAS ? ' on' : ''}" id="tInc" ${inc ? '' : 'disabled'} title="${inc ? 'Mostrar só as fichas em que falta alguma parte' : 'Todas as fichas estão completas'}"><span class="ti">${ICO(inc ? 'alert' : 'check-circle')}</span><div><b>${inc}</b><span>${inc===1?'ficha incompleta':'fichas incompletas'}</span></div></button>`;
  host.hidden = !igs.length;
  const b = document.getElementById('tInc');
  if (b && inc) b.onclick = ()=>{ SO_INCOMPLETAS = !SO_INCOMPLETAS; desenharPainel(); desenharLista(); if (document.body.classList.contains('na-ficha')) fecharFicha(); };
}
function desenharLista(){
  ordenar(); desenharGeral();
  const q = (document.getElementById('busca').value||'').trim().toLowerCase();
  const casa = i => [i.cidade, i.nome, i.codigo, i.endereco, ...i.anciaes, ...i.diaconos, ...i.coopOficio, ...i.coopJovens, ...i.encLocais, ...i.encRegionais, ...i.examinadoras].join(' ').toLowerCase();
  const vis = DADOS.igrejas.filter(i => (!q || casa(i).includes(q)) && (!SO_INCOMPLETAS || incompleta(i)));
  const host = document.getElementById('lista');
  const total = DADOS.igrejas.length;
  const res = document.getElementById('resumo');
  res.innerHTML = !total ? '' : SO_INCOMPLETAS ? `<span>Só as incompletas (${vis.length})</span><button type="button" id="bTodas">ver todas</button>`
    : q ? `<span>${vis.length} de ${total} ${total===1?'igreja':'igrejas'}</span>` : '<span>Toque numa igreja para abrir a ficha</span>';
  const bt = document.getElementById('bTodas'); if (bt) bt.onclick = ()=>{ SO_INCOMPLETAS = false; desenharPainel(); desenharLista(); };
  if (!total){ host.innerHTML = `<div class="vazio">Nenhuma igreja cadastrada em ${esc(REGIOES[REG])}.</div>`; return; }
  if (!vis.length){ host.innerHTML = '<div class="vazio">Nada encontrado.</div>'; return; }
  let h = '', ult = null;
  vis.forEach(i=>{
    const c = (i.cidade||'').trim().toUpperCase() || 'SEM CIDADE';
    if (c !== ult){ ult = c; h += `<div class="cid-h">${esc(c)}<em>${vis.filter(x=>((x.cidade||'').trim().toUpperCase()||'SEM CIDADE')===c).length}</em></div>`; }
    const falta = partes(i).filter(p => !p[1]).map(p => p[0]);
    h += `<button type="button" class="it${i.id===SEL?' on':''}" data-id="${i.id}"><span class="it-n">${esc(i.nome || '(sem nome)')}${falta.length ? `<span class="falta" title="Falta: ${esc(falta.join(', '))}"></span>` : ''}</span>${semanaHTML(i)}<small>${esc([i.codigo, i.anciaes.filter(Boolean)[0]].filter(Boolean).join(' · ') || 'sem código')}</small></button>`;
  });
  host.innerHTML = h;
  host.querySelectorAll('.it').forEach(b=>b.onclick=()=>{ SEL = b.dataset.id; desenharLista(); desenharFicha(); abrirFicha(); });
}

/* ---------- visão geral: a região inteira numa tabela ---------- */
let VISAO = (()=>{ try { return localStorage.getItem('ccb_igrejas_visao') === 'geral' ? 'geral' : 'fichas'; } catch(e){ return 'fichas'; } })();
function mudarVisao(v){
  VISAO = v; try { localStorage.setItem('ccb_igrejas_visao', v); } catch(e){}
  if (v === 'geral' && document.body.classList.contains('na-ficha')) fecharFicha();
  desenharGeral();
}
function desenharGeral(){
  const bar = document.getElementById('vis'), host = document.getElementById('geral'); if (!bar || !host) return;
  const tem = DADOS && DADOS.igrejas.length > 0;
  bar.hidden = !tem;
  const geral = tem && VISAO === 'geral';
  document.body.classList.toggle('v-geral', geral); host.hidden = !geral;
  bar.querySelectorAll('button').forEach(b=>{ const on = b.dataset.v === (geral ? 'geral' : 'fichas'); b.classList.toggle('on', on); b.setAttribute('aria-selected', on); b.onclick = ()=>mudarVisao(b.dataset.v); });
  if (!geral){ host.innerHTML = ''; return; }
  ordenar();
  const igs = DADOS.igrejas.filter(i => !SO_INCOMPLETAS || incompleta(i));
  const nm = v => { const n = nomesDe(v); return n.length ? n.map(x=>`<span class="nm">${esc(x)}</span>`).join('<br>') : '<span class="fa">falta</span>'; };
  const op = v => { const n = nomesDe(v); return n.length ? n.map(x=>`<span class="nm">${esc(x)}</span>`).join('<br>') : '<span class="tr">—</span>'; };
  let h = '<table class="tab"><thead><tr><th>Casa de oração</th><th>Cultos</th><th>Anciães</th><th>Diáconos</th><th>Enc. locais</th><th>Ensaio local</th></tr></thead><tbody>', ult = null;
  igs.forEach(i=>{
    const c = (i.cidade||'').trim().toUpperCase() || 'SEM CIDADE';
    if (c !== ult){ ult = c; h += `<tr class="cid"><td colspan="6">${esc(c)}</td></tr>`; }
    const cultos = (i.cultos||[]).filter(x=>x.dia && x.hora).slice().sort((a,b)=> DIAS.indexOf(a.dia)-DIAS.indexOf(b.dia) || String(a.hora).localeCompare(String(b.hora)));
    const ens = (i.ensaios||[]).filter(e=>e.dia && e.hora);
    h += `<tr class="ig" data-id="${i.id}" tabindex="0" title="Abrir a ficha"><td><b>${esc(i.nome || '(sem nome)')}</b><small>${esc([i.codigo, i.endereco].filter(Boolean).join(' · ')) || '<span class="fa">falta código e endereço</span>'}</small></td>` +
      `<td data-r="Cultos">${cultos.length ? '<div>' + cultos.map(x=>`<span class="ch"><b>${esc(x.dia.slice(0,3))}</b>${esc(horaBR(x.hora))}${x.tipo && x.tipo !== 'Culto' ? `<em>${esc(x.tipo)}</em>` : ''}${x.obs ? `<em>${esc(x.obs)}</em>` : ''}</span>`).join('') + '</div>' : '<span class="fa">falta</span>'}</td>` +
      `<td data-r="Anciães"><div>${nm(i.anciaes)}</div></td><td data-r="Diáconos"><div>${nm(i.diaconos)}</div></td><td data-r="Enc. locais"><div>${op(i.encLocais)}</div></td>` +
      `<td data-r="Ensaio">${ens.length ? '<div>' + ens.map(e=>`<span class="nm">${esc([e.semana, e.dia.slice(0,3), horaBR(e.hora)].filter(Boolean).join(' '))}</span>`).join('<br>') + '</div>' : '<span class="tr">—</span>'}</td></tr>`;
  });
  host.innerHTML = igs.length ? h + '</tbody></table>' : '<div class="geral-vazio">Nenhuma ficha para mostrar.</div>';
  const abrir = id => { SEL = id; VISAO = 'fichas'; try { localStorage.setItem('ccb_igrejas_visao', 'fichas'); } catch(e){} desenharGeral(); desenharLista(); desenharFicha(); abrirFicha(); window.scrollTo(0, 0); };
  host.querySelectorAll('tr.ig').forEach(tr=>{ tr.onclick = ()=>abrir(tr.dataset.id); tr.onkeydown = e=>{ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(tr.dataset.id); } }; });
}

/* ---------- celular: lista -> ficha -> voltar ---------- */
const telaPequena = () => window.matchMedia('(max-width:980px)').matches;
function abrirFicha(){
  if (!telaPequena() || document.body.classList.contains('na-ficha')) return;
  document.getElementById('corpo').classList.add('det'); document.body.classList.add('na-ficha');
  try { history.pushState({ ficha:1 }, ''); } catch(e){}
  window.scrollTo(0, 0);
}
function fecharFicha(porHistorico){
  if (!document.body.classList.contains('na-ficha')) return;
  document.getElementById('corpo').classList.remove('det'); document.body.classList.remove('na-ficha');
  if (!porHistorico){ try { if (history.state && history.state.ficha) history.back(); } catch(e){} }
  const on = document.querySelector('#lista .it.on'); if (on) on.scrollIntoView({ block:'center' });
}
window.addEventListener('popstate', ()=>fecharFicha(true));

/* a ficha mudou: atualiza o topo dela, o resumo da região e a lista (sem tirar o cursor do campo) */
let _tRefresco = null;
function agendarRefresco(){ clearTimeout(_tRefresco); _tRefresco = setTimeout(()=>{ atualizarHeroi(); desenharPainel(); desenharLista(); }, 160); }
function atualizarHeroi(){
  const ig = atual(); const h = document.getElementById('heroiCorpo'); if (!ig || !h) return;
  const ordemDia = d => DIAS.indexOf(d);
  const cultos = (ig.cultos||[]).filter(c => c.dia && c.hora).slice().sort((a,b)=> ordemDia(a.dia)-ordemDia(b.dia) || String(a.hora).localeCompare(String(b.hora)));
  const ps = partes(ig), feitas = ps.filter(p => p[1]).length, falta = ps.filter(p => !p[1]).map(p => p[0]);
  document.getElementById('hSub').textContent = (ig.cidade || 'Cidade').toUpperCase() + (ig.codigo ? ' · ' + ig.codigo : '');
  document.getElementById('hNome').textContent = ig.nome || 'Nova igreja';
  h.innerHTML =
    (ig.endereco && ig.endereco.trim() ? `<div class="h-end">${ICO('pin')}<span>${esc(ig.endereco)}</span></div>` : '') +
    `<div class="h-cultos">${cultos.length ? cultos.map(c => `<span><b>${esc(DIA_CURTO[c.dia] || c.dia)}</b>${esc(horaBR(c.hora))}${c.tipo && c.tipo !== 'Culto' ? `<em>${esc(c.tipo)}</em>` : ''}${c.obs ? `<em>${esc(c.obs)}</em>` : ''}</span>`).join('') : '<span class="nenhum">Nenhum culto com horário ainda</span>'}</div>` +
    `<div class="h-prog${falta.length ? '' : ' cheia'}"><span class="barra">${ps.map(p => `<i class="${p[1] ? 's' : ''}"></i>`).join('')}</span>` +
    (falta.length ? `<span><b>${feitas} de ${ps.length}</b> partes preenchidas · falta ${esc(falta.join(', '))}</span>` : `<span><b>Ficha completa</b></span>`) + `</div>`;
  document.querySelectorAll('#fichaHost .bloco h3 em[data-cnt]').forEach(em=>{
    const k = em.dataset.cnt;
    const n = k === 'cultos' ? (ig.cultos||[]).length : k === 'min' ? MINISTERIO.reduce((a,[c])=>a+nomesDe(ig[c]).length,0) : MUSICA.reduce((a,[c])=>a+nomesDe(ig[c]).length,0);
    const um = k === 'cultos' ? 'horário' : 'nome', mais = k === 'cultos' ? 'horários' : 'nomes';
    em.textContent = n + ' ' + (n === 1 ? um : mais); em.classList.toggle('zero', !n);
  });
}

/* ---------- ficha ---------- */
const atual = () => DADOS.igrejas.find(i=>i.id===SEL);
function campo(rot, valor, onInput, extra){
  const d = document.createElement('div');
  d.innerHTML = `<label>${esc(rot)}</label><input type="text" value="${esc(valor)}" ${extra||''}>`;
  const inp = d.querySelector('input');
  inp.oninput = ()=>{ onInput(inp.value); guardar(); };
  return d;
}
function listaNomes(ig, chave, rot, item){
  const d = document.createElement('div');
  const desenhar = ()=>{
    if (!ig[chave].length) ig[chave] = [''];
    d.innerHTML = `<label>${esc(rot)}</label><div class="nomes"></div>`;
    const box = d.querySelector('.nomes');
    ig[chave].forEach((v, idx)=>{
      const ni = document.createElement('div'); ni.className = 'ni';
      const inp = document.createElement('input'); inp.type = 'text'; inp.value = v; inp.placeholder = item + ' (ex.: Ir. João)'; inp.setAttribute('aria-label', rot + ' ' + (idx+1));
      inp.setAttribute('list', 'dlNomes');
      inp.oninput = ()=>{ ig[chave][idx] = inp.value; guardar(); if (chave==='anciaes' || idx===0) desenharLista(); };
      inp.onkeydown = e=>{ if (e.key==='Enter'){ e.preventDefault(); ig[chave].push(''); desenhar(); const t = d.querySelectorAll('input'); t[t.length-1].focus(); guardar(); } };
      ni.appendChild(inp);
      if (ig[chave].length > 1){ const x = document.createElement('button'); x.type='button'; x.className='rem'; x.title='Tirar'; x.innerHTML=ICO('x'); x.onclick=()=>{ ig[chave].splice(idx,1); guardar(); desenhar(); desenharLista(); }; ni.appendChild(x); }
      if (idx === ig[chave].length-1){ const a = document.createElement('button'); a.type='button'; a.className='add'; a.title='Acrescentar ' + item.toLowerCase() + ' (ou Enter)'; a.innerHTML=ICO('plus'); a.onclick=()=>{ ig[chave].push(''); guardar(); desenhar(); const t = d.querySelectorAll('input'); t[t.length-1].focus(); }; ni.appendChild(a); }
      else { const sp = document.createElement('span'); sp.style.width='34px'; ni.appendChild(sp); }
      box.appendChild(ni);
    });
  };
  desenhar();
  return d;
}
function opcoes(lista, valor){ return lista.map(o=>`<option${o===valor?' selected':''}>${esc(o)}</option>`).join(''); }
function linhasCultos(ig){
  const d = document.createElement('div'); d.className = 'linhas';
  const desenhar = ()=>{
    d.innerHTML = ig.cultos.length ? `<div class="lc lc-cab"><span>Dia</span><span>Tipo</span><span>Horário</span><span>Observação</span><span></span></div>` : '<div class="dica">Nenhum culto lançado ainda.</div>';
    ig.cultos.forEach((c, idx)=>{
      const l = document.createElement('div'); l.className = 'lc';
      l.innerHTML = `<select aria-label="Dia">${opcoes(DIAS, c.dia)}</select><select aria-label="Tipo">${opcoes(TIPOS_CULTO, c.tipo)}</select><input type="time" aria-label="Horário" value="${esc(c.hora)}"><input type="text" aria-label="Observação" placeholder="Ex.: 1º e 3º domingo" value="${esc(c.obs)}"><button type="button" class="x" title="Excluir">${ICO('x')}</button>`;
      const [sd, st, ih, io] = l.querySelectorAll('select,input');
      sd.onchange = ()=>{ c.dia = sd.value; guardar(); };
      st.onchange = ()=>{ c.tipo = st.value; guardar(); };
      ih.onchange = ih.oninput = ()=>{ c.hora = ih.value; guardar(); };
      io.oninput = ()=>{ c.obs = io.value; guardar(); };
      l.querySelector('.x').onclick = ()=>{ ig.cultos.splice(idx,1); guardar(); desenhar(); };
      d.appendChild(l);
    });
    const m = document.createElement('button'); m.type='button'; m.className='mais'; m.innerHTML = ICO('plus') + 'Acrescentar culto';
    m.onclick = ()=>{ const ult = ig.cultos[ig.cultos.length-1]; ig.cultos.push({ dia: ult ? ult.dia : 'Domingo', tipo: 'Culto', hora: '', obs: '' }); guardar(); desenhar(); d.querySelectorAll('.lc:last-of-type select')[0]?.focus(); };
    d.appendChild(m);
  };
  desenhar(); return d;
}
function linhasEnsaios(ig){
  const d = document.createElement('div'); d.className = 'linhas';
  const desenhar = ()=>{
    d.innerHTML = ig.ensaios.length ? `<div class="le le-cab"><span>Semana</span><span>Dia</span><span>Horário</span><span>Observação</span><span></span></div>` : '<div class="dica">Nenhum ensaio local lançado.</div>';
    ig.ensaios.forEach((c, idx)=>{
      const l = document.createElement('div'); l.className = 'le';
      l.innerHTML = `<select aria-label="Semana do mês">${opcoes(SEMANAS, c.semana)}</select><select aria-label="Dia">${opcoes(DIAS, c.dia)}</select><input type="time" aria-label="Horário" value="${esc(c.hora)}"><input type="text" aria-label="Observação" placeholder="Ex.: meses ímpares" value="${esc(c.obs)}"><button type="button" class="x" title="Excluir">${ICO('x')}</button>`;
      const [ss, sd, ih, io] = l.querySelectorAll('select,input');
      ss.onchange = ()=>{ c.semana = ss.value; guardar(); };
      sd.onchange = ()=>{ c.dia = sd.value; guardar(); };
      ih.onchange = ih.oninput = ()=>{ c.hora = ih.value; guardar(); };
      io.oninput = ()=>{ c.obs = io.value; guardar(); };
      l.querySelector('.x').onclick = ()=>{ ig.ensaios.splice(idx,1); guardar(); desenhar(); };
      d.appendChild(l);
    });
    const m = document.createElement('button'); m.type='button'; m.className='mais'; m.innerHTML = ICO('plus') + 'Acrescentar ensaio';
    m.onclick = ()=>{ ig.ensaios.push({ semana:'1º', dia:'Domingo', hora:'', obs:'' }); guardar(); desenhar(); };
    d.appendChild(m);
  };
  desenhar(); return d;
}
function bloco(icone, titulo, sub, cnt){
  const b = document.createElement('section'); b.className = 'bloco';
  b.innerHTML = `<h3><span class="bi">${ICO(icone)}</span><span>${esc(titulo)}${sub ? ` <small>${esc(sub)}</small>` : ''}</span>${cnt ? `<em data-cnt="${cnt}"></em>` : ''}</h3>`;
  return b;
}
function desenharFicha(){
  const host = document.getElementById('fichaHost');
  const ig = atual();
  if (!ig){
    host.innerHTML = `<div class="vazia-ficha"><div class="vi">${ICO('pin')}</div><b>${DADOS.igrejas.length ? 'Escolha uma igreja' : 'Nenhuma igreja cadastrada'}</b>${DADOS.igrejas.length ? 'Abra uma ficha pela lista ou cadastre uma nova.' : `Comece o relatório de ${esc(REGIOES[REG])} cadastrando a primeira casa de oração.`}<br><button type="button" class="primary" onclick="novaIgreja()">${ICO('plus')}Nova igreja</button></div>`;
    if (document.body.classList.contains('na-ficha')) fecharFicha();
    return;
  }
  const f = document.createElement('div'); f.className = 'ficha';
  f.innerHTML = `<div class="heroi">
    <button type="button" class="h-volta" id="bVolta">${ICO('chevron-left')}Igrejas</button>
    <div class="h-l1"><div class="h-tit"><small id="hSub"></small><h2 id="hNome"></h2></div>
      <div class="h-acoes">
        <button type="button" id="bDup" title="Copiar esta ficha para cadastrar outra parecida">${ICO('copy')}Duplicar</button>
        <button type="button" id="bDel" class="danger" title="Excluir esta igreja">${ICO('trash')}Excluir</button>
      </div></div>
    <div id="heroiCorpo"></div></div>
    <div class="cartoes"></div>`;
  const cart = f.querySelector('.cartoes');
  const colA = document.createElement('div'); colA.className = 'colm a';
  const colB = document.createElement('div'); colB.className = 'colm b';
  cart.append(colA, colB);
  const reTit = ()=>{};

  const b1 = bloco('pin', 'Identificação');
  const g1 = document.createElement('div'); g1.className = 'grid g-id';
  g1.appendChild(campo('Cidade', ig.cidade, v=>{ ig.cidade = v; reTit(); }, 'list="dlCidades" placeholder="Ex.: Campo Mourão"'));
  g1.appendChild(campo('Casa de oração (bairro)', ig.nome, v=>{ ig.nome = v; reTit(); }, 'placeholder="Ex.: Central, Jd. Tropical"'));
  g1.appendChild(campo('Código', ig.codigo, v=>{ ig.codigo = v; reTit(); }, 'placeholder="Ex.: BR-21-0123"'));
  b1.appendChild(g1);
  const g1b = document.createElement('div'); g1b.className = 'grid g-end'; g1b.style.marginTop = '12px';
  g1b.appendChild(campo('Endereço', ig.endereco, v=>{ ig.endereco = v; }, 'placeholder="Rua, número, bairro"'));
  b1.appendChild(g1b);
  colA.appendChild(b1);

  const b2 = bloco('calendar', 'Cultos e RJM', 'dias e horários', 'cultos');
  b2.appendChild(linhasCultos(ig)); colB.appendChild(b2);

  const b3 = bloco('users', 'Ministério', '', 'min');
  const g3 = document.createElement('div'); g3.className = 'grid g-2';
  MINISTERIO.forEach(([k, rot, item])=>g3.appendChild(listaNomes(ig, k, rot, item)));
  b3.appendChild(g3); colA.appendChild(b3);

  const b4 = bloco('music', 'Parte musical', '', 'mus');
  const g4 = document.createElement('div'); g4.className = 'grid g-2';
  MUSICA.forEach(([k, rot, item])=>g4.appendChild(listaNomes(ig, k, rot, item)));
  b4.appendChild(g4);
  const t4 = document.createElement('div'); t4.innerHTML = '<div class="sub-t">Ensaio local</div>';
  t4.appendChild(linhasEnsaios(ig)); b4.appendChild(t4);
  colB.appendChild(b4);

  const b5 = bloco('file', 'Observações'); b5.classList.add('larg');
  const ta = document.createElement('textarea'); ta.value = ig.obs || ''; ta.placeholder = 'Qualquer informação a mais sobre esta igreja';
  ta.oninput = ()=>{ ig.obs = ta.value; guardar(); };
  b5.appendChild(ta); cart.appendChild(b5);

  f.querySelector('#bDel').onclick = ()=>excluirIgreja(ig.id);
  f.querySelector('#bDup').onclick = ()=>duplicarIgreja(ig.id);
  f.querySelector('#bVolta').onclick = ()=>fecharFicha();
  host.replaceChildren(f);
  atualizarHeroi();
  atualizarSugestoes();
}
function novaIgreja(){
  if (VISAO === 'geral'){ VISAO = 'fichas'; try { localStorage.setItem('ccb_igrejas_visao', 'fichas'); } catch(e){} }
  const base = atual();
  const ig = normalizar({ igrejas:[{ cidade: base ? base.cidade : '' }] }, REG).igrejas[0];
  ig.cultos = [{ dia:'Domingo', tipo:'Culto', hora:'', obs:'' }];
  DADOS.igrejas.push(ig); SEL = ig.id; SO_INCOMPLETAS = false; guardar(); desenharLista(); desenharFicha(); abrirFicha();
  const n = document.querySelectorAll('#fichaHost .g-id input')[base && base.cidade ? 1 : 0]; if (n) n.focus();
}
function duplicarIgreja(id){
  const o = DADOS.igrejas.find(i=>i.id===id); if (!o) return;
  const c = JSON.parse(JSON.stringify(o)); c.id = novoId(); c.nome = (o.nome||'') + ' (cópia)'; c.codigo = '';
  DADOS.igrejas.push(c); SEL = c.id; guardar(); desenharLista(); desenharFicha();
  UI.toast('Ficha duplicada. Ajuste o nome e o código.', 'ok');
}
function excluirIgreja(id){
  const i = DADOS.igrejas.findIndex(x=>x.id===id); if (i<0) return;
  const [ig] = DADOS.igrejas.splice(i,1);
  SEL = (DADOS.igrejas[i] || DADOS.igrejas[i-1] || {}).id || null;
  guardar(); desenharLista(); desenharFicha();
  UI.toast(`“${(ig.cidade?ig.cidade+' - ':'') + (ig.nome||'igreja')}” excluída.`, { action:{ label:'Desfazer', icon:'undo', fn:()=>{ DADOS.igrejas.splice(i,0,ig); SEL = ig.id; guardar(); desenharLista(); desenharFicha(); } } });
}
// sugestões: cidades e nomes já cadastrados na região
function atualizarSugestoes(){
  const mk = (id, vals)=>{ let dl = document.getElementById(id); if (!dl){ dl = document.createElement('datalist'); dl.id = id; document.body.appendChild(dl); } dl.innerHTML = [...new Set(vals.filter(v=>v && v.trim()).map(v=>v.trim()))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(v=>`<option value="${esc(v)}">`).join(''); };
  mk('dlCidades', DADOS.igrejas.map(i=>i.cidade));
  mk('dlNomes', DADOS.igrejas.flatMap(i=>[...i.anciaes, ...i.diaconos, ...i.coopOficio, ...i.coopJovens, ...i.encLocais, ...i.encRegionais, ...i.examinadoras]));
}

/* ---------- regiões ---------- */
function regioesPermitidas(){
  const s = window.__SESSAO || {};
  const lists = s.role === 'admin' ? Object.keys(REGIOES) : (s.lists || []);
  return Object.keys(REGIOES).filter(r => lists.includes(r));
}
function abrirRegiao(r){
  REG = r; try { localStorage.setItem('ccb_igrejas_ultima', r); } catch(e){}
  DADOS = ler(r);
  PENDENTE = (()=>{ try { return localStorage.getItem(chaveLocal(r)+'_pend')==='1'; } catch(e){ return false; } })();
  NUVEM_EM = null;
  ordenar(); SEL = DADOS.igrejas[0] ? DADOS.igrejas[0].id : null;
  document.getElementById('busca').value = ''; SO_INCOMPLETAS = false;
  if (document.body.classList.contains('na-ficha')) fecharFicha();
  desenharTudo();
  carregarNuvem(false);
}
function desenharTudo(){ desenharRegioes(); desenharPainel(); desenharLista(); desenharFicha(); mostrarEstado(); }

window.__aoEntrar = function(){
  const perm = regioesPermitidas();
  if (!perm.length){
    document.querySelector('.corpo').innerHTML = '<div class="vazia-ficha" style="grid-column:1/-1"><b>Nenhuma região liberada</b>Para editar o relatório de igrejas de uma região, peça ao administrador acesso à lista dessa região.</div>';
    return;
  }
  let ult = null; try { ult = localStorage.getItem('ccb_igrejas_ultima'); } catch(e){}
  const pedida = new URLSearchParams(location.search).get('regiao');
  abrirRegiao(perm.includes(pedida) ? pedida : perm.includes(ult) ? ult : perm[0]);
  // vindo da busca da tela inicial: &igreja=<id> abre a ficha
  const igPedida = new URLSearchParams(location.search).get('igreja');
  if (igPedida && DADOS.igrejas.some(i => i.id === igPedida)){ SEL = igPedida; if (VISAO === 'geral') mudarVisao('fichas'); desenharLista(); desenharFicha(); abrirFicha(); }
};
if (window.__SESSAO) window.__aoEntrar(window.__SESSAO);

/* =====================================================================
   Impressão: uma ficha por igreja, duas por linha, agrupadas por cidade
   ===================================================================== */
function fontesCSS(){
  const base = location.origin + '/assets/fonts/roboto-latin-';
  const face = (p, e) => `@font-face{font-family:'RobotoLista';font-style:${e};font-weight:${p};font-display:block;src:url('${base}${p}-${e}.woff2') format('woff2');}`;
  return face(400,'normal') + face(700,'normal') + face(400,'italic') + face(700,'italic');
}
function horaBR(h){ if (!h) return ''; const [H,M] = h.split(':'); return M && M !== '00' ? `${+H}h${M}` : `${+H}h`; }
function nomesDe(v){ return (v||[]).map(x=>String(x||'').trim()).filter(Boolean); }
function fichaHTML(ig){
  const linha = (rot, vals) => { const n = nomesDe(vals); return n.length ? `<tr><th>${esc(rot)}</th><td>${n.map(esc).join(' · ')}</td></tr>` : ''; };
  const ordemDia = d => DIAS.indexOf(d);
  const cultos = (ig.cultos||[]).filter(c=>c.dia || c.hora).slice().sort((a,b)=> ordemDia(a.dia)-ordemDia(b.dia) || String(a.hora).localeCompare(String(b.hora)));
  const cultosHTML = cultos.length ? `<table class="cultos"><tbody>${cultos.map(c=>`<tr><td class="cd">${esc(c.dia)}</td><td class="ch">${esc(horaBR(c.hora))}</td><td class="ct">${esc(c.tipo||'')}${c.obs ? ` <i>(${esc(c.obs)})</i>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="nada">—</div>';
  const ensaios = (ig.ensaios||[]).filter(e=>e.dia || e.hora).map(e=>`${e.semana && e.semana!=='Todo' ? esc(e.semana)+' ' : (e.semana==='Todo' ? 'Todo ' : '')}${esc((e.dia||'').toLowerCase())}${e.hora ? ' · ' + esc(horaBR(e.hora)) : ''}${e.obs ? ` <i>(${esc(e.obs)})</i>` : ''}`);
  const CURTO = { anciaes:'Anciães', diaconos:'Diáconos', coopOficio:'Coop. do Ofício', coopJovens:'Coop. Jovens e Men.', encLocais:'Enc. Locais', encRegionais:'Enc. Regionais', examinadoras:'Examinadoras' };
  const min = MINISTERIO.map(([k])=>linha(CURTO[k], ig[k])).join('');
  const mus = MUSICA.map(([k])=>linha(CURTO[k], ig[k])).join('') + (ensaios.length ? `<tr><th>Ensaio local</th><td>${ensaios.join(' · ')}</td></tr>` : '');
  return `<div class="ficha">
    <div class="f-cab"><div><span class="f-cid">${esc((ig.cidade||'').toUpperCase())}</span><span class="f-nome">${esc(ig.nome||'')}</span></div>${ig.codigo ? `<span class="f-cod">${esc(ig.codigo)}</span>` : ''}</div>
    ${ig.endereco ? `<div class="f-end">${esc(ig.endereco)}</div>` : ''}
    <div class="f-sec">Cultos e RJM</div>${cultosHTML}
    <div class="f-sec">Ministério</div>${min ? `<table class="pes"><tbody>${min}</tbody></table>` : '<div class="nada">—</div>'}
    <div class="f-sec">Parte musical</div>${mus ? `<table class="pes"><tbody>${mus}</tbody></table>` : '<div class="nada">—</div>'}
    ${ig.obs && ig.obs.trim() ? `<div class="f-obs"><b>Obs.:</b> ${esc(ig.obs).replace(/\n/g,'<br>')}</div>` : ''}
  </div>`;
}
function documentoHTML(){
  ordenar();
  const grupos = new Map();
  DADOS.igrejas.forEach(i=>{ const c = (i.cidade||'').trim().toUpperCase() || 'SEM CIDADE'; if (!grupos.has(c)) grupos.set(c, []); grupos.get(c).push(i); });
  const hoje = new Date().toLocaleDateString('pt-BR');
  let corpo = '';
  grupos.forEach((igs, c)=>{
    corpo += `<section class="cidade"><h2 class="c-tit"><span>${esc(c)}</span><em>${igs.length} ${igs.length===1?'igreja':'igrejas'}</em></h2><div class="fichas">${igs.map(fichaHTML).join('')}</div></section>`;
  });
  if (!corpo) corpo = '<p style="text-align:center;color:#777;margin-top:40mm">Nenhuma igreja cadastrada.</p>';
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de Igrejas - ${esc(REGIOES[REG])}</title><style>
${fontesCSS()}
@page{size:A4 portrait;margin:11mm 10mm 13mm;
  @bottom-left{content:"Relatório de Igrejas · Região ${esc(REGIOES[REG])} · emitido em ${hoje}";font-family:'RobotoLista',Arial,sans-serif;font-size:7.5pt;color:#555}
  @bottom-right{content:"Página " counter(page) " de " counter(pages);font-family:'RobotoLista',Arial,sans-serif;font-size:7.5pt;color:#555}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'RobotoLista',Arial,sans-serif;color:#111;font-size:9.6pt;line-height:1.28;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.topo{display:flex;align-items:center;gap:4mm;border-bottom:1.2pt solid #1b2a41;padding-bottom:2.5mm;margin-bottom:4mm}
.topo img{height:13mm}
.topo .tx{flex:1;text-align:center}
.topo h1{margin:0;font-size:13pt;letter-spacing:.14em}
.topo h2{margin:1mm 0 0;font-size:10.5pt;letter-spacing:.06em;font-weight:700}
.topo .dt{font-size:8pt;color:#555;text-align:right;width:28mm}
.cidade{margin-bottom:3mm}
.c-tit{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 2mm;padding:1.2mm 3mm;background:#1b2a41;color:#fff;border-radius:1.6mm;font-size:10.5pt;letter-spacing:.1em}
.c-tit em{font-style:normal;font-weight:400;font-size:8.5pt;letter-spacing:0;opacity:.85}
.fichas{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.ficha{border:.8pt solid #9aa3b2;border-radius:2mm;padding:2.4mm 3mm 2.6mm;break-inside:avoid;page-break-inside:avoid}
.f-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:2mm;border-bottom:.8pt solid #1b2a41;padding-bottom:1.2mm;margin-bottom:1.2mm}
.f-cid{display:block;font-size:7.5pt;font-weight:700;letter-spacing:.1em;color:#a97d3d}
.f-nome{display:block;font-size:11.5pt;font-weight:700}
.f-cod{font-size:8.5pt;font-weight:700;border:.8pt solid #1b2a41;border-radius:1.2mm;padding:.3mm 1.6mm;white-space:nowrap}
.f-end{font-size:9pt;margin-bottom:.6mm}
.f-sec{font-size:7.6pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a97d3d;margin:1.6mm 0 .5mm}
table{width:100%;border-collapse:collapse}
.cultos td{padding:.25mm 0;vertical-align:top}
.cultos .cd{width:17mm;font-weight:700}
.cultos .ch{width:11mm}
.pes th{width:27mm;white-space:nowrap;text-align:left;font-weight:700;vertical-align:top;padding:.25mm 1.5mm .25mm 0;font-size:8.6pt}
.pes td{padding:.25mm 0;vertical-align:top}
.pes tr+tr th,.pes tr+tr td,.cultos tr+tr td{border-top:.4pt solid #e1e1e1}
.nada{color:#888}
.f-obs{margin-top:1.4mm;font-size:8.8pt;border-top:.4pt solid #ddd;padding-top:1mm}
</style></head><body>
<div class="topo"><img src="${location.origin}/assets/ccb-logo.png" alt=""><div class="tx"><h1>CONGREGAÇÃO CRISTÃ NO BRASIL</h1><h2>RELATÓRIO DE IGREJAS · REGIÃO ${esc(REGIOES[REG].toUpperCase())} - PR</h2></div><div class="dt">Emitido em<br>${hoje}</div></div>
${corpo}
</body></html>`;
}
function esperarFontes(doc, ms){
  const f = doc && doc.fonts; if (!f || !f.load) return Promise.resolve();
  const t = Promise.all(['400 12px RobotoLista','700 12px RobotoLista','italic 400 12px RobotoLista'].map(x=>f.load(x).catch(()=>{}))).then(()=>f.ready);
  return Promise.race([t, new Promise(r=>setTimeout(r, ms||4000))]);
}
function abrirDoc(imprimir){
  const w = window.open('', imprimir ? '_blank' : 'previaIgrejas');
  if (!w){ UI.toast('O navegador bloqueou a janela nova. Permita pop-ups para este site.', 'error'); return; }
  w.document.open(); w.document.write(documentoHTML()); w.document.close();
  if (imprimir){
    const imgs = Array.from(w.document.images).map(im => im.complete ? null : new Promise(r=>{ im.onload = im.onerror = r; })).filter(Boolean);
    Promise.all([esperarFontes(w.document, 5000), Promise.race([Promise.all(imgs), new Promise(r=>setTimeout(r,5000))])]).then(()=>setTimeout(()=>{ w.focus(); w.print(); }, 150));
  } else w.focus();
}
function abrirPrevia(){ abrirDoc(false); }
function gerarPDF(){ abrirDoc(true); }
window.__documentoHTML = documentoHTML;
</script>
<script src="/assets/appbar.js"></script>
<script>
/* barra de aplicativo (só aparece no celular) */
AppBar.montar([
  { ic:'pin', rot:'Igrejas', fn:()=>{ if (document.body.classList.contains('na-ficha')) fecharFicha(); mudarVisao('fichas'); window.scrollTo({ top:0, behavior:'smooth' }); }, ativo:()=>!document.body.classList.contains('v-geral') },
  { ic:'grid', rot:'Visão geral', fn:()=>{ mudarVisao('geral'); window.scrollTo({ top:0, behavior:'smooth' }); }, ativo:()=>document.body.classList.contains('v-geral') },
  { ic:'file', rot:'Arquivo', menu:'#menuArq .menu-box' },
  { ic:'print', rot:'Gerar PDF', fn:()=>gerarPDF(), destaque:true }
]);
</script>
</body>
</html>
