<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function () {
  document.documentElement.style.visibility = 'hidden';
  var token = localStorage.getItem('session_token');
  if (!token) { window.location.replace('/login.html'); return; }
  fetch('/api/verify-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, list: 'calendarioanual' })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.ok) {
      document.documentElement.style.visibility = 'visible';
      var lists = Array.isArray(data.lists) ? data.lists : [];
      function montarBarraTopo() {
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed; top:12px; right:12px; z-index:99999; display:flex; gap:8px;';
        if (data.role === 'admin' || lists.length > 1) {
          var backBtn = document.createElement('a');
          backBtn.href = data.role === 'admin' ? '/admin-listas.html' : '/minhas-listas.html';
          backBtn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"></use></svg>Voltar'; backBtn.className = 'topnav-btn';
          backBtn.style.cssText = 'background:#fff; color:#1b2a41; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; border:1.5px solid #e4dcc9; box-shadow:0 4px 10px -4px rgba(27,42,65,.3);';
          bar.appendChild(backBtn);
        }
        var sairBtn = document.createElement('a');
        sairBtn.href = '#';
        sairBtn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-logout"></use></svg>Sair'; sairBtn.className = 'topnav-btn';
        sairBtn.style.cssText = 'background:linear-gradient(180deg,#2c3f5c,#1b2a41); color:#fdfbf6; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; box-shadow:0 6px 16px -6px rgba(27,42,65,.5);';
        sairBtn.onclick = function (e) {
          e.preventDefault();
          localStorage.removeItem('session_token');
          window.location.href = '/login.html';
        };
        bar.appendChild(sairBtn);
        document.body.appendChild(bar);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', montarBarraTopo);
      } else {
        montarBarraTopo();
      }
    } else {
      localStorage.removeItem('session_token');
      window.location.replace('/login.html');
    }
  }).catch(function () {
    window.location.replace('/login.html');
  });
})();
</script>

<body>
<header>
  <h1>Calendário de Reuniões</h1>
  <p>Escolha o mês, lance os serviços em cada dia e veja a página A4 ao lado. Feriados nacionais entram automaticamente.</p>
</header>
<div class="wrap">
  <div class="panel" id="form">
    <div class="bar">
      <button class="primary" onclick="imprimir()"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-print"></use></svg>Imprimir / salvar PDF (capa + 12 meses)</button>
      <button id="btnListaSalvar" onclick="salvarLista()"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-cloud-up"></use></svg>Salvar na nuvem</button>
      <button id="btnListaCarregar" onclick="carregarLista()"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-cloud-down"></use></svg>Carregar da nuvem</button>
      <button onclick="exportar()" title="Baixa um arquivo .json com tudo"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-download"></use></svg>Baixar backup</button>
      <button onclick="document.getElementById('imp').click()" title="Abre um arquivo .json baixado antes"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-upload"></use></svg>Abrir backup</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(event)">
      <button class="danger" onclick="if(confirm('Apagar todos os serviços?')){S.dias={};salvar();montar()}"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-trash"></use></svg>Limpar tudo</button>
    </div>
    <div class="meta">
      <div><label>Igreja / órgão</label><input id="m_org" oninput="meta('org',this.value)"></div>
      <div><label>Localidade</label><input id="m_sub" oninput="meta('sub',this.value)"></div>
      <div><label>Ano</label><input id="m_ano" type="number" oninput="meta('ano',this.value)"></div>
    </div>
    <div class="meta" style="grid-template-columns:1fr">
      <div><label>Texto da capa <span style="font-weight:400;color:#7a7466">(independente do restante do calendário; só o ano é o mesmo)</span></label></div>
    </div>
    <div class="meta">
      <div><label>Texto sob o logo</label><input id="m_capaOrg" oninput="meta('capaOrg',this.value)"></div>
      <div><label>Título da capa</label><input id="m_capaTitulo" oninput="meta('capaTitulo',this.value)"></div>
      <div><label>Localidade na capa</label><input id="m_capaSub" oninput="meta('capaSub',this.value)"></div>
    </div>
    <div class="meta" style="grid-template-columns:1fr">
      <div><label>Observação no rodapé de cada página</label><input id="m_rod" oninput="meta('rod',this.value)"></div>
    </div>
    <div class="meses" id="meses"></div>
    <div id="dias"></div>
  </div>
  <div class="panel" id="prevHost">
    <h3 style="margin:0 0 10px;color:var(--primary)">Pré-visualização (A4 retrato)</h3>
    <div id="prevScroll"><div id="prev"></div></div>
  </div>
</div>
<div id="print"></div>

<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEM=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];
const TIPOS={local:['Reuniões locais – ministeriais e administrativas','#1b2a41'],musical:['Reuniões locais – setor musical','#3f7d58'],manut:['Reuniões locais – manutenção preventiva','#a97d3d'],regional:['Reuniões regionais','#2563eb'],estadual:['Reuniões estaduais','#6b4c9a'],brasil:['Reuniões nível Brasil (BRÁS)','#5f6b7a'],ensaio:['Ensaios regionais','#7c4a2d'],mocidade:['Reuniões para a mocidade','#d4801f']};
const HOL='#c0392b',HOLE='#e11d74',HOLM='#0d9488';
const HOLEG=[[HOL,'Feriados nacionais'],[HOLE,'Feriados / pontos facultativos do Paraná'],[ '#c78a2c','Pontos facultativos (Carnaval, Corpus Christi)'],[HOLM,'Feriados municipais de Campo Mourão']];
function anivCM(y){if(new Date(y,9,10).getDay()==0)return '10-10';const d=new Date(y,9,12),a=((1-d.getDay()+7)%7)||7;d.setDate(12+a);return p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function locais(y){const o={};o[anivCM(y)]=['Aniversário de Campo Mourão (feriado municipal)','m'];
  if(y==2026){o['01-02']=['Recesso do Executivo estadual (Paraná)','e'];o['04-02']=['Ponto facultativo estadual (Paraná)','e'];o['04-20']=['Véspera de Tiradentes – ponto facultativo estadual (Paraná)','e']}
  return o}
const CARGOS=[['Anc','ANCIÃES',1],['Dcn','DIÁCONOS',1],['Com','COOPERADORES DO OFÍCIO MINISTERIAL',1],['Cjm','COOPERADORES DE JOVENS E MENORES',1],['Ero','ENCARREGADOS REGIONAIS DE ORQUESTRA',1],['Elo','ENCARREGADOS LOCAIS DE ORQUESTRA',1],['Adm','ADMINISTRAÇÃO',1],['Adm (Convocados)','ADMINISTRAÇÃO CONVOCADOS',0],['Dcn da Regional (Convocados)','DIÁCONOS DA REGIONAL CONVOCADOS',0],['Dcn da Regional','DIÁCONOS DA REGIONAL',0],['Adm Regional','ADMINISTRAÇÃO DA REGIONAL',0],['Adm Casas de Oração','ADMINISTRAÇÃO DAS CASAS DE ORAÇÃO',0],['Dcn (Convocados)','DIÁCONOS CONVOCADOS',0],['Dcn do Estado (Todos)','DIÁCONOS DO ESTADO',0],['Anc e *Dcn do Estado (Todos)','ANCIÃES E DIÁCONOS DO ESTADO',0],['Adm Titulares e Vices','ADMINISTRAÇÃO TITULARES E VICES',0]].map(a=>({code:a[0],label:a[1],showInLegend:!!a[2],useAsterisk:true}));
const KEY='ccb_calendario_reunioes_anual';
/* logo da capa já carregado e decodificado: a capa aparece sem piscar */
const LOGO_CAPA=new Image();LOGO_CAPA.src='/assets/ccb-logo.png';if(LOGO_CAPA.decode)LOGO_CAPA.decode().catch(()=>{});
let S={meta:{org:'Congregação Cristã no Brasil',sub:'CAMPO MOURÃO/PR',ano:2026,rod:'As reuniões deste calendário estão sujeitas a alterações.'},dias:{}};
let cur=0; // 0..11 mês; -1 capa; -2 legenda; -3 ano

try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.cargos)S.cargos=JSON.parse(JSON.stringify(CARGOS));
const p2=n=>String(n).padStart(2,'0');
const kk=(m,d)=>p2(m+1)+'-'+p2(d);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* Atualiza um trecho da tela SEM recriar o que já existe: compara o HTML novo com
   o atual e só mexe no que mudou. Imagens e ícones não são recarregados (sem piscar),
   e o campo em que se está digitando mantém o foco e o cursor. */
function patch(alvo,html){
  const t=document.createElement('template');t.innerHTML=html;
  patchFilhos(alvo,t.content);
}
function patchFilhos(a,b){
  const av=[...a.childNodes],bv=[...b.childNodes];
  for(let i=0;i<bv.length;i++){
    const n=bv[i],o=av[i];
    if(!o){a.appendChild(n);continue}
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){a.replaceChild(n,o);continue}
    // elemento que muda de ação ao clicar (ex.: serviço aberto <-> minimizado) é trocado inteiro;
    // se fosse só ajustado, o mesmo clique continuava subindo e disparava a ação nova (abria de novo)
    if(o.nodeType===1&&o.getAttribute('onclick')!==n.getAttribute('onclick')){a.replaceChild(n,o);continue}
    if(o.nodeType===3||o.nodeType===8){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue}
    patchNo(o,n);
  }
  for(let i=av.length-1;i>=bv.length;i--)av[i].remove();
}
function patchNo(o,n){
  for(const at of [...o.attributes])if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
  for(const at of [...n.attributes])if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
  const tag=o.nodeName;
  if(tag==='INPUT'||tag==='TEXTAREA'){
    const v=tag==='TEXTAREA'?n.textContent:(n.getAttribute('value')||'');
    if(o.type==='checkbox'||o.type==='radio')o.checked=n.hasAttribute('checked');
    else if(o!==document.activeElement&&o.value!==v)o.value=v;
    if(tag==='TEXTAREA')return;
  }
  if(tag==='DETAILS')o.open=n.hasAttribute('open');
  patchFilhos(o,n);
  if(tag==='SELECT'){const sel=[...n.querySelectorAll('option')].findIndex(x=>x.hasAttribute('selected'));if(sel>=0&&o.selectedIndex!==sel)o.selectedIndex=sel}
}

function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia)}
function feriados(y){
  const f={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Dia da Independência','10-12':'N. S. Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};
  const P=pascoa(y);
  [[-47,'Carnaval'],[-2,'Sexta-feira Santa'],[0,'Domingo de Páscoa'],[60,'Corpus Christi']].forEach(([o,n])=>{const d=new Date(P);d.setDate(d.getDate()+o);f[p2(d.getMonth()+1)+'-'+p2(d.getDate())]=n});
  return f;
}

/* ---------- Páginas ---------- */
function paginaMes(m){
  const y=+S.meta.ano,n=new Date(y,m+1,0).getDate(),fer=feriados(y);let rows='';
  let temServ=false;
  for(let d=1;d<=n;d++){
    const w=new Date(y,m,d).getDay(),k=kk(m,d),f=fer[k],es=S.dias[k]||[];
    if(es.length)temServ=true;
    rows+=`<div class="r${w==0?' dom':''}${f?' fer':''}${es.length?'':' r-vazio'}"><div class="d"><b>${d}</b><span>${SEM[w]}</span></div><div class="e">${f?`<div class="f">${esc(f)}</div>`:''}${es.map(e=>`<div class="s" style="--c:${TIPOS[e.t][1]}">${esc(e.x)}${e.h?` - <i>${esc(hr(e.h))}</i>`:''}${e.a&&e.a.trim()?` <span class="at">Atende ${esc(e.a.trim())}</span>`:''}${cvHTML(e)}</div>`).join('')}</div></div>`;
  }
  const leg=Object.values(TIPOS).map(t=>`<em><u style="background:${t[1]}"></u>${t[0]}</em>`).join('')+`<em><u style="background:${HOL}"></u>Feriados</em>`;
  return `<div class="pg mes"><div class="top"><h2>${MESES[m].toUpperCase()}</h2><span>${esc(S.meta.org)}<br>${esc(S.meta.sub)} · ${esc(S.meta.ano)}</span></div><div class="dias${temServ?'':' sem-serv'}">${rows}</div><div class="leg">${leg}</div><div class="rod">${esc(S.meta.rod)}</div></div>`;
}
function garantirCapa(){const m=S.meta;if(m.capaOrg===undefined)m.capaOrg=m.org||'';if(m.capaTitulo===undefined)m.capaTitulo='CALENDÁRIO DE REUNIÕES';if(m.capaSub===undefined)m.capaSub=m.sub||''}
function paginaCapa(){
  garantirCapa();
  return `<div class="pg capa"><img class="capa-logo" src="/assets/ccb-logo.png" alt="Congregação Cristã no Brasil"><small>${esc(S.meta.capaOrg).toUpperCase()}</small><h2>${esc(S.meta.capaTitulo)}</h2><p>${esc(S.meta.capaSub)}</p><div class="ano" style="font-family:Fraunces,serif;font-style:italic">${esc(S.meta.ano)}</div></div>`;
}

function cvHTML(e){const a=(e.c||[]).map(code=>{const g=S.cargos.find(x=>x.code==code);return `<span class="cc">${g&&g.useAsterisk===false?'':'*'}${esc(code)}</span>`}).join('')+(e.o?`<span class="cv">${esc(e.o)}</span>`:'');return a?`<div class="cvb">${a}</div>`:''}
function grad(c){if(c.length==1)return c[0];const s=100/c.length;return 'linear-gradient(135deg,'+c.map((x,i)=>`${x} ${(i*s).toFixed(1)}% ${((i+1)*s).toFixed(1)}%`).join(',')+')'}
function cab(t){return `<div class="top"><h2>${t}</h2><span>${esc(S.meta.org)}<br>${esc(S.meta.sub)} · ${esc(S.meta.ano)}</span></div>`}
function paginaLegenda(){
  const it=Object.values(TIPOS).map(t=>`<div class="li"><u style="background:${t[1]}"></u>${t[0]}</div>`).join('');
  const inf=(S.meta.info||'').trim();
  return `<div class="pg">${cab('LEGENDA')}<p class="ex">Cada dia da página "Calendário" é colorido conforme os tipos de reunião lançados naquele dia. Quando há mais de um tipo, a cor do dia é dividida.</p><div class="legp">${it}</div><h3 class="sub">Cargos e Ministérios</h3><div class="cvl">${S.cargos.filter(g=>g.showInLegend!==false).map(g=>`<div><span class="cc">${esc(g.code)}</span> = ${esc(g.label)}</div>`).join('')}</div>${inf?`<h3 class="sub">Informações</h3><div class="info">${esc(inf).replace(/\n/g,'<br>')}</div>`:''}<div class="rod">${esc(S.meta.rod)}</div></div>`;
}
const CATF={nac:['Nacional',HOL],fac:['Ponto facultativo','#c78a2c'],est:['Paraná',HOLE],mun:['Campo Mourão',HOLM]};
function feriadosFull(y){const L=[],add=(k,n,t)=>L.push({k,n,t});
  [['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência do Brasil'],['10-12','N. S. Aparecida'],['11-02','Finados'],['11-15','Proclamação da República']].forEach(a=>add(a[0],a[1],'nac'));
  if(y>=2024)add('11-20','Consciência Negra','nac');add('12-25','Natal','nac');
  const P=pascoa(y),o=n=>{const d=new Date(P);d.setDate(d.getDate()+n);return p2(d.getMonth()+1)+'-'+p2(d.getDate())};
  add(o(-2),'Sexta-feira Santa','nac');add(o(0),'Domingo de Páscoa','nac');
  add(o(-48),'Carnaval (ponto facultativo)','fac');add(o(-47),'Carnaval (ponto facultativo)','fac');add(o(-46),'Quarta-feira de Cinzas (até 14h)','fac');add(o(60),'Corpus Christi (ponto facultativo)','fac');
  const l=locais(y);Object.keys(l).forEach(k=>add(k,l[k][0],l[k][1]=='e'?'est':'mun'));
  return L.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0)}
function paginaFeriados(){
  const y=+S.meta.ano,L=feriadosFull(y),map={},pr=['nac','mun','est','fac'];L.forEach(h=>{(map[h.k]=map[h.k]||[]).push(h)});let h='';
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
    let g='DSTQQSS'.split('').map(x=>`<b>${x}</b>`).join('')+'<i></i>'.repeat(first);
    for(let d=1;d<=n;d++){
      const k=kk(m,d),hs=map[k],es=S.dias[k]||[],w=new Date(y,m,d).getDay(),c=[];
      if(hs)c.push(CATF[pr.find(p=>hs.some(x=>x.t==p))][1]);
      [...new Set(es.map(e=>e.t))].forEach(t=>c.push(TIPOS[t][1]));
      const tip=[...(hs||[]).map(x=>x.n),...es.map(e=>e.x)].filter(Boolean).join(' | ');
      g+=c.length?`<span class="m" style="background:${grad(c)}" title="${esc(tip)}">${d}</span>`:`<span class="${w==0?'dom':''}">${d}</span>`;
    }
    h+=`<div class="mm"><h4>${MESES[m]}</h4><div class="g">${g}</div></div>`;
  }
  const lista=L.map(x=>{const a=x.k.split('-');return `<div class="fl"><b style="color:${CATF[x.t][1]}">${+a[1]}/${a[0]}</b>${esc(x.n)}</div>`}).join('');
  const lg=Object.values(TIPOS).map(t=>`<em><u style="background:${t[1]}"></u>${t[0]}</em>`).join('')+Object.values(CATF).map(c=>`<em><u style="background:${c[1]}"></u>Feriado: ${c[0]}</em>`).join('');
  return `<div class="pg">${cab('CALENDÁRIO')}<div class="fgrid">${h}</div><h3 class="sub">Lista de feriados</h3><div class="fls">${lista}</div><div class="leg" style="margin-top:3mm">${lg}</div><div class="rod">${esc(S.meta.rod)}</div></div>`}
function pagina(c){return c==-4?paginaFeriados():c==-1?paginaCapa():c==-2?paginaLegenda():paginaMes(c)}

/* ---------- Painel de edição ---------- */
function montar(){
  garantirCapa();
  ['org','sub','ano','rod','capaOrg','capaTitulo','capaSub'].forEach(k=>document.getElementById('m_'+k).value=S.meta[k]||'');
  patch(document.getElementById('meses'),[['Capa',-1],['Legenda',-2],['Calendário',-4]].map(a=>`<button class="${cur==a[1]?'on':''}" onclick="ir(${a[1]})">${a[0]}</button>`).join('')+MESES.map((n,i)=>`<button class="${cur==i?'on':''}" onclick="ir(${i})">${n}</button>`).join(''));
  const box=document.getElementById('dias');
  if(cur<0){patch(box,'<p style="font-size:13px;color:#7a7466">'+(cur==-4?'Calendário do ano, com os feriados (nacionais, pontos facultativos, Paraná e Campo Mourão) e com os dias coloridos pelos tipos de reunião lançados nos meses. É gerado automaticamente.':cur==-1?'Esta é a capa. Ajuste os textos nos campos acima.':cur==-2?'Legenda dos tipos de reunião, dos convocados e dos feriados do ano.':'Calendário do ano: os dias são coloridos automaticamente pelos serviços lançados em cada mês. Passe o mouse sobre um dia para ver o que há nele.')+'</p>'+(cur==-2?cargosEditor():''));preview();return}
  const y=+S.meta.ano,n=new Date(y,cur+1,0).getDate(),fer=feriados(y);let h='';
  for(let d=1;d<=n;d++){
    const w=new Date(y,cur,d).getDay(),k=kk(cur,d),es=S.dias[k]||[],ab=!!aDia[k];
    h+=`<div class="win${ab?' open':''}${w==0?' dom':''}${fer[k]?' fer':''}${es.length?' tem':''}" data-k="${k}"><div class="win-head" role="button" tabindex="0" aria-expanded="${ab}" onclick="togDia('${k}',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togDia('${k}',this)}"><div class="wh-l"><span class="caret"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-chevron-right"></use></svg></span><span class="wd">${d}</span><span class="ws">${SEM[w].charAt(0)+SEM[w].slice(1).toLowerCase()}</span>${fer[k]?`<span class="wf">${esc(fer[k])}</span>`:''}</div><div class="wh-r">${resumoHead(es)}</div></div><div class="win-body">${es.map((e,i)=>entHTML(k,i,e)).join('')}<button class="add" onclick="novo('${k}')">+ serviço</button></div></div>`;
  }
  patch(box,`<div class="bar2"><button onclick="tudo('d',1)">Recolher dias</button><button onclick="tudo('d',0)">Expandir dias</button><button onclick="tudo('e',1)">Recolher reuniões</button><button onclick="tudo('e',0)">Expandir reuniões</button></div>`+h);preview();
}
function hr(v){v=String(v||'').trim();const m=v.match(/^(\d{1,2})[:.hH]?(\d{2})?$/);if(!m)return v;const h=+m[1],mi=m[2];if(h>23||(mi&&+mi>59))return v;return h+'h'+(mi&&mi!='00'?mi+'min':'')}
function horaInput(el,k,i){edit(k,i,'h',el.value);if(/^\d{4}$/.test(el.value.trim()))horaBlur(el,k,i)}
function horaBlur(el,k,i){el.value=hr(el.value);S.dias[k][i].h=el.value;salvar();preview()}
const aDia={},fEnt={};
function togDia(k,el){aDia[k]=!aDia[k];const w=el.parentNode;w.classList.toggle('open',aDia[k]);el.setAttribute('aria-expanded',aDia[k])}
function togEnt(id){fEnt[id]=!fEnt[id];montar()}
function tudo(t,f){const n=new Date(+S.meta.ano,cur+1,0).getDate();for(let d=1;d<=n;d++){const k=kk(cur,d);if(t=='d')aDia[k]=!f;else (S.dias[k]||[]).forEach((e,i)=>{fEnt[k+'#'+i]=!!f})}montar()}
let DG=null;
function dgStart(ev,k,i){DG={k,i};ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain','servico');
  const el=ev.target.closest('.entw,.entc');if(el&&ev.dataTransfer.setDragImage)ev.dataTransfer.setDragImage(el,14,14);
  document.body.classList.add('dgon')}
function dgEnd(){DG=null;document.body.classList.remove('dgon');document.querySelectorAll('.win.dgover').forEach(x=>x.classList.remove('dgover'))}
function dgOver(ev,el){if(!DG)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';el.classList.add('dgover')}
function dgLeave(ev,el){if(!el.contains(ev.relatedTarget))el.classList.remove('dgover')}
/* ---- Arraste por ponteiro: a página continua rolando (rodinha do mouse ou
   encostando na borda da tela) enquanto o serviço está sendo arrastado ---- */
let DGP=null;
function dgDown(ev,k,i){
  if(ev.button!==undefined&&ev.button!==0)return;
  ev.preventDefault();ev.stopPropagation();
  DGP={k,i,x0:ev.clientX,y0:ev.clientY,x:ev.clientX,y:ev.clientY,src:ev.target.closest('.entw,.entc'),on:false,ghost:null,alvo:null,raf:0};
  document.addEventListener('pointermove',dgMove);document.addEventListener('pointerup',dgUp);
  document.addEventListener('pointercancel',dgLimpar);document.addEventListener('keydown',dgKey);
  window.addEventListener('scroll',dgScroll,true);
}
function dgMove(ev){
  if(!DGP)return;DGP.x=ev.clientX;DGP.y=ev.clientY;
  if(!DGP.on){if(Math.hypot(DGP.x-DGP.x0,DGP.y-DGP.y0)<4)return;dgIniciar()}
  ev.preventDefault();dgPos();
}
function dgIniciar(){
  DGP.on=true;DG={k:DGP.k,i:DGP.i};document.body.classList.add('dgon');
  const e=(S.dias[DGP.k]||[])[DGP.i],g=document.createElement('div');g.className='dg-ghost';
  g.innerHTML='<u style="background:'+(e&&TIPOS[e.t]?TIPOS[e.t][1]:'#999')+'"></u><span>'+esc(e?((e.h?hr(e.h)+' ':'')+e.x):'Serviço')+'</span>';
  document.body.appendChild(g);DGP.ghost=g;if(DGP.src)DGP.src.classList.add('dg-origem');
  DGP.raf=requestAnimationFrame(dgAuto);
}
function dgPos(){
  if(DGP.ghost)DGP.ghost.style.transform='translate('+(DGP.x+14)+'px,'+(DGP.y+12)+'px)';
  const el=document.elementFromPoint(DGP.x,DGP.y),w=el&&el.closest?el.closest('#dias .win'):null;
  if(w!==DGP.alvo){if(DGP.alvo)DGP.alvo.classList.remove('dgover');DGP.alvo=w;if(w&&w.dataset.k!==DGP.k)w.classList.add('dgover')}
}
/* encostou perto da borda de cima/baixo da tela: rola sozinho */
function dgAuto(){
  if(!DGP||!DGP.on)return;const m=70,h=window.innerHeight;let v=0;
  if(DGP.y<m)v=-Math.ceil((m-DGP.y)/4);else if(DGP.y>h-m)v=Math.ceil((DGP.y-(h-m))/4);
  if(v)window.scrollBy(0,v);
  DGP.raf=requestAnimationFrame(dgAuto);
}
function dgScroll(){if(DGP&&DGP.on)dgPos()}
function dgKey(e){if(e.key==='Escape')dgLimpar()}
function dgUp(){if(!DGP)return;const st=DGP;dgLimpar();if(st.on&&st.alvo)dgMover(st.k,st.i,st.alvo.dataset.k)}
function dgLimpar(){
  if(!DGP)return;cancelAnimationFrame(DGP.raf);
  if(DGP.ghost)DGP.ghost.remove();if(DGP.src)DGP.src.classList.remove('dg-origem');if(DGP.alvo)DGP.alvo.classList.remove('dgover');
  document.removeEventListener('pointermove',dgMove);document.removeEventListener('pointerup',dgUp);
  document.removeEventListener('pointercancel',dgLimpar);document.removeEventListener('keydown',dgKey);
  window.removeEventListener('scroll',dgScroll,true);DGP=null;dgEnd();
}
function dgDrop(ev,k2){
  if(!DG)return;ev.preventDefault();const {k,i}=DG;dgEnd();dgMover(k,i,k2);
}
function dgMover(k,i,k2){
  if(!k2||k==k2||!S.dias[k]||!S.dias[k][i])return;
  const e=S.dias[k].splice(i,1)[0];
  if(!S.dias[k].length)delete S.dias[k];
  Object.keys(fEnt).forEach(x=>{if(x.startsWith(k+'#'))delete fEnt[x]});
  (S.dias[k2]=S.dias[k2]||[]).push(e);aDia[k2]=true;
  salvar();montar()}
function resumoHead(es){
  if(!es.length)return '<span class="vz">sem serviços</span>';
  const sh=es.slice(0,2).map(e=>`<span class="rs"><u style="background:${TIPOS[e.t][1]}"></u>${esc(hr(e.h))} ${esc(e.x)}</span>`).join('');
  return `<span class="rl">${sh}${es.length>2?`<span class="mais">+${es.length-2}</span>`:''}</span><span class="qtd">${es.length}</span>`}
function entHTML(k,i,e){
  const id=k+'#'+i;
  if(fEnt[id])return `<div class="entc" style="--c:${TIPOS[e.t][1]}" onclick="event.stopPropagation();togEnt('${id}')" title="Abrir para editar"><span class="dg" title="Arraste para outro dia (a rodinha do mouse rola a página)" onclick="event.stopPropagation()" onpointerdown="dgDown(event,'${k}',${i})"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-grip"></use></svg></span><span class="entc-caret"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-chevron-right"></use></svg></span><u style="background:${TIPOS[e.t][1]}"></u><span>${esc(hr(e.h))} ${esc(e.x)||'(sem descrição)'} ${esc((e.c||[]).map(c=>'*'+c).join(' '))}</span></div>`;
  const tipos=Object.entries(TIPOS).map(([v,t])=>`<option value="${v}"${e.t==v?' selected':''}>${t[0]}</option>`).join('');
  return `<div class="entw" style="--c:${TIPOS[e.t][1]}">`+
    `<div class="ent-top"><span class="dg" title="Arraste para outro dia (a rodinha do mouse rola a página)" onpointerdown="dgDown(event,'${k}',${i})"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-grip"></use></svg></span>`+
    `<select class="ent-tipo" aria-label="Tipo de reunião" onchange="edit('${k}',${i},'t',this.value);montar()">${tipos}</select>`+
    `<div class="ent-acoes">`+
      `<button class="ac" title="Repetir no mesmo dia da semana (mesma posição no mês) em todos os outros meses" onclick="repetir('${k}',${i})"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-refresh"></use></svg>Todo mês</button>`+
      `<button class="ac" title="Repetir a cada 2 meses (pula 1 mês), no mesmo dia da semana e na mesma posição no mês" onclick="repetir('${k}',${i},2)"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-refresh"></use></svg>A cada 2 meses</button>`+
      `<button class="ac" title="Repetir a cada 3 meses (pula 2 meses), no mesmo dia da semana e na mesma posição no mês" onclick="repetir('${k}',${i},3)"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-refresh"></use></svg>A cada 3 meses</button>`+
      `<button class="ac ic-only tg" title="Minimizar este serviço" aria-label="Minimizar" onclick="event.stopPropagation();togEnt('${id}')"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-chevron-down"></use></svg></button>`+
      `<button class="ac ic-only danger" title="Remover este serviço" aria-label="Remover" onclick="remover('${k}',${i})"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-trash"></use></svg></button>`+
    `</div></div>`+
    `<div class="ent-campos">`+
      `<div class="fc fc-h"><label>Horário</label><input value="${esc(e.h)}" placeholder="19:30" inputmode="numeric" oninput="horaInput(this,'${k}',${i})" onblur="horaBlur(this,'${k}',${i})"></div>`+
      `<div class="fc fc-x"><label>Descrição do serviço</label><input class="tx" value="${esc(e.x)}" placeholder="Ex.: Reunião Ministerial" oninput="edit('${k}',${i},'x',this.value,1)"></div>`+
      `<div class="fc fc-a"><label>Quem atende <span class="opc">(opcional)</span></label><input value="${esc(e.a||'')}" placeholder="Ex.: Ir. Carlos Roberto" oninput="edit('${k}',${i},'a',this.value)"></div>`+
    `</div>${cvEd(k,i,e)}</div>`}
const fCv={};
function cvSum(e){const c=e.c||[];const t=c.map(code=>{const g=S.cargos.find(x=>x.code==code);return `<span class="cc2">${g&&g.useAsterisk===false?'':'*'}${esc(code)}</span>`}).join('')+(e.o?`<em class="oo">${esc(e.o)}</em>`:'');return t||'<span class="nenhum">nenhum selecionado</span>'}
function cvOpt(k,i,e,g,ci){return `<label class="opt" title="${esc(g.label)}"><input type="checkbox" ${(e.c||[]).includes(g.code)?'checked':''} onchange="cvTog('${k}',${i},${ci},this.checked)"><span>${g.useAsterisk!==false?'*':''}${esc(g.code)}</span></label>`}
function cvEd(k,i,e){
  const id='cv_'+k+'_'+i,all=S.cargos.map((g,ci)=>[g,ci]),pr=all.filter(x=>x[0].showInLegend!==false),ou=all.filter(x=>x[0].showInLegend===false);
  const og=l=>`<div class="og">${l.map(x=>cvOpt(k,i,e,x[0],x[1])).join('')}</div>`;
  return `<details class="cvd"${fCv[id]?' open':''} ontoggle="fCv['${id}']=this.open"><summary><b>Convocados</b><span class="sel" id="${id}">${cvSum(e)}</span></summary><div class="cvp"><div class="grp">Principais</div>${og(pr)}${ou.length?`<div class="grp">Outros cargos</div>${og(ou)}`:''}<input type="text" value="${esc(e.o||'')}" placeholder="Outros convocados (ex.: Organistas)" oninput="cvTxt('${k}',${i},this.value)"></div></details>`}
function cvUp(k,i){const el=document.getElementById('cv_'+k+'_'+i);if(el)el.innerHTML=cvSum(S.dias[k][i]);preview()}
function cvTog(k,i,ci,on){const e=S.dias[k][i],c=e.c=e.c||[],code=S.cargos[ci].code,p=c.indexOf(code);if(on&&p<0)c.push(code);if(!on&&p>=0)c.splice(p,1);salvar();cvUp(k,i)}
function cvTxt(k,i,v){S.dias[k][i].o=v;salvar();cvUp(k,i)}
function cargosEditor(){return `<label style="margin-top:14px">Informações na legenda (opcional — só aparece se você escrever)</label><textarea rows="4" placeholder="Ex.: avisos, observações gerais..." oninput="meta('info',this.value)">${esc(S.meta.info||'')}</textarea>`+`<h3 style="margin:16px 0 4px;font-size:14px;color:var(--primary)">Cargos e Ministérios</h3><p style="font-size:12px;color:#7a7466;margin:0 0 8px">Siglas disponíveis ao lançar um serviço. 1ª caixa: mostra na legenda · 2ª caixa: coloca * na frente.</p>`+S.cargos.map((g,i)=>`<div class="cg"><input value="${esc(g.code)}" oninput="cg(${i},'code',this.value)"><input value="${esc(g.label)}" oninput="cg(${i},'label',this.value)"><input type="checkbox" title="Mostrar na legenda" ${g.showInLegend!==false?'checked':''} onchange="cg(${i},'showInLegend',this.checked)"><input type="checkbox" title="Asterisco" ${g.useAsterisk!==false?'checked':''} onchange="cg(${i},'useAsterisk',this.checked)"><button class="danger" onclick="cgDel(${i})" title="Remover"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#i-x"></use></svg></button></div>`).join('')+`<button onclick="cgAdd()">+ cargo</button>`}
function cg(i,f,v){S.cargos[i][f]=v;salvar();preview()}
function cgDel(i){S.cargos.splice(i,1);salvar();montar()}
function cgAdd(){S.cargos.push({code:'Nova',label:'NOVO CARGO',showInLegend:true,useAsterisk:true});salvar();montar()}
function ir(i){cur=i;montar()}
function meta(k,v){S.meta[k]=k=='ano'?(+v||2026):v;salvar();if(k=='ano'){montar()}else preview()}
function novo(k){aDia[k]=true;(S.dias[k]=S.dias[k]||[]).push({t:'local',h:'19h30min',x:'',c:[],o:''});salvar();montar()}
function remover(k,i){Object.keys(fEnt).forEach(x=>{if(x.startsWith(k+'#'))delete fEnt[x]});S.dias[k].splice(i,1);if(!S.dias[k].length)delete S.dias[k];salvar();montar()}
function edit(k,i,f,v,live){S.dias[k][i][f]=v;salvar();preview()}
function repetir(k,i,passo){
  passo=passo||1;
  const e=S.dias[k][i],m0=+k.slice(0,2)-1,d0=+k.slice(3),y=+S.meta.ano,w=new Date(y,m0,d0).getDay(),nth=Math.ceil(d0/7);let c=0;
  for(let m=0;m<12;m++){if(m==m0||Math.abs(m-m0)%passo)continue;let cnt=0;const n=new Date(y,m+1,0).getDate();
    for(let d=1;d<=n;d++){if(new Date(y,m,d).getDay()==w&&++cnt==nth){const kk2=kk(m,d),l=S.dias[kk2]=S.dias[kk2]||[];if(!l.some(o=>o.x==e.x&&o.h==e.h)){l.push({...e,c:[...(e.c||[])]});c++}break}}}
  salvar();montar();alert(c+' mês(es) receberam este serviço ('+nth+'º '+SEM[w].toLowerCase()+' do mês'+(passo>1?', a cada '+passo+' meses':'')+').');
}

/* ---------- Preview / impressão ---------- */
function preview(){
  if(cur>=0)calcularFonteMes();
  const el=document.getElementById('prev');patch(el,pagina(cur));
  ajustar(el);caber(el);
  const pg=el.firstChild,w=document.getElementById('prevScroll').clientWidth-20;pg.style.zoom=Math.min(1,w/794);
}
/* redimensionar a janela: no máximo uma atualização por quadro */
let rzPend=0;function previewRz(){if(!rzPend)rzPend=requestAnimationFrame(()=>{rzPend=0;preview()})}
/* Garante que NENHUMA página passe da folha A4: se o conteúdo ultrapassar, reduz tudo proporcionalmente até caber */
function caber(root){
  let falhas=0;
  root.querySelectorAll('.pg').forEach(pg=>{
    const kids=[...pg.children].filter(c=>!c.classList.contains('dias'));kids.forEach(c=>{c.style.zoom=''});
    let z=1,n=0;
    const estoura=()=>pg.scrollHeight>pg.clientHeight+1||pg.scrollWidth>pg.clientWidth+1||[...pg.querySelectorAll('.dias')].some(d=>d.scrollHeight>d.clientHeight+1);
    while(estoura()&&z>.35&&n++<80){z=Math.round((z-.01)*100)/100;kids.forEach(c=>{c.style.zoom=z})}
    if(estoura())falhas++;
  });
  return falhas;
}
/* Mesmo tamanho de letra em TODOS os meses: o maior (até FONTE_MAX) que faz todos caberem na página.
   FONTE_PISO: um mês cheio demais não puxa o ano todo para baixo desse tamanho; só ele diminui (exceção). */
const FONTE_MAX=11,FONTE_PISO=9;
let FONTE_MES=FONTE_MAX;
let FONTE_CHAVE='';
function calcularFonteMes(forcar){
  // só refaz a medição (pesada: monta os 12 meses) quando algo que muda os meses mudou
  const ch=JSON.stringify([S.meta.ano,S.meta.org,S.meta.sub,S.meta.rod,S.dias,S.cargos,document.fonts?document.fonts.status:'']);
  if(!forcar&&ch===FONTE_CHAVE)return FONTE_MES;
  FONTE_CHAVE=ch;
  const el=document.getElementById('print');
  el.innerHTML=MESES.map((_,m)=>paginaMes(m)).join('');
  el.classList.add('medindo');
  let fs=FONTE_MAX;
  el.querySelectorAll('.dias').forEach(d=>{
    // maior tamanho em que ESTE mês cabe (sem passar do piso)
    let f=fs;d.style.fontSize=f+'pt';
    while(f>FONTE_PISO&&d.scrollHeight>d.clientHeight+1){f=Math.round((f-.25)*100)/100;d.style.fontSize=f+'pt'}
    // se nem no piso coube, o mês é exceção e não puxa os outros para baixo
    if(d.scrollHeight<=d.clientHeight+1)fs=f;
  });
  el.classList.remove('medindo');el.innerHTML='';
  FONTE_MES=fs;return fs;
}
/* Aplica o tamanho único; só se algum mês ainda não couber (não deveria), reduz aquele mês */
function ajustar(root){root.querySelectorAll('.dias').forEach(d=>{let fs=FONTE_MES,n=0;d.style.fontSize=fs+'pt';while(d.scrollHeight>d.clientHeight+1&&fs>2&&n++<100){fs-=.25;d.style.fontSize=fs+'pt'}})}
function prepararImpressao(){
  calcularFonteMes(true);
  const el=document.getElementById('print');
  el.innerHTML=paginaCapa()+paginaLegenda()+paginaFeriados()+MESES.map((_,m)=>paginaMes(m)).join('');
  el.classList.add('medindo');ajustar(el);const f=caber(el);el.classList.remove('medindo');if(f)console.warn(f+' página(s) não coube(ram) totalmente.');
}
window.addEventListener('beforeprint',prepararImpressao);
if(document.fonts&&document.fonts.ready){
  document.documentElement.classList.add('fontes-carregando');
  const mostrar=()=>document.documentElement.classList.remove('fontes-carregando');
  setTimeout(mostrar,1500); // rede lenta: não deixa a folha escondida
  document.fonts.ready.then(()=>{preview();mostrar()});
}
function imprimir(){prepararImpressao();setTimeout(()=>window.print(),150)}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='calendario_reunioes_'+S.meta.ano+'.json';a.click()}
function importar(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);if(!S.cargos)S.cargos=JSON.parse(JSON.stringify(CARGOS));salvar();montar()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
window.addEventListener('resize',previewRz);
montar();
</script>
