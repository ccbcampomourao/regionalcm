<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function () {
  document.documentElement.style.visibility = 'hidden';
  var token = localStorage.getItem('session_token');
  if (!token) { window.location.replace('/login.html'); return; }
  fetch('/api/verify-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, list: 'calendario' })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.ok) {
      document.documentElement.style.visibility = 'visible';
      var lists = Array.isArray(data.lists) ? data.lists : [];
      function montarBarraTopo() {
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed; top:12px; right:12px; z-index:99999; display:flex; gap:8px;';

        if (data.role === 'admin' || lists.length > 1) {
          var backBtn = document.createElement('a');
          backBtn.href = data.role === 'admin' ? '/admin-listas.html' : '/minhas-listas.html';
          backBtn.textContent = '← Voltar';
          backBtn.style.cssText = 'background:#fff; color:#1b2a41; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; border:1.5px solid #e4dcc9; box-shadow:0 4px 10px -4px rgba(27,42,65,.3);';
          bar.appendChild(backBtn);
        }

        var sairBtn = document.createElement('a');
        sairBtn.href = '#';
        sairBtn.textContent = 'Sair';
        sairBtn.style.cssText = 'background:linear-gradient(180deg,#2c3f5c,#1b2a41); color:#fdfbf6; text-decoration:none; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600; font-family:Inter, Arial, Helvetica, sans-serif; box-shadow:0 6px 16px -6px rgba(27,42,65,.5);';
        sairBtn.onclick = function (e) {
          e.preventDefault();
          localStorage.removeItem('session_token');
          window.location.href = '/login.html';
        };
        bar.appendChild(sairBtn);

        document.body.appendChild(bar);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', montarBarraTopo);
      } else {
        montarBarraTopo();
      }
    } else {
      localStorage.removeItem('session_token');
      window.location.replace('/login.html');
    }
  }).catch(function () {
    window.location.replace('/login.html');
  });
})();
</script>
<meta charset="UTF-8">
<title>Calendário dos Ensaios Locais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --primary: #1b2a41; --primary-2: #2c3f5c; --brass: #a97d3d; --brass-lt: #c99a55; --accent: #b04b3c; --bg: #f5f1e8; --line: #e4dcc9; }
  * { box-sizing: border-box; font-family: 'Inter', Arial, sans-serif; }
  body { margin: 0; background: var(--bg); color: #24304a; }
  header { background: linear-gradient(180deg, var(--primary-2), var(--primary)); color: #fdfbf6; padding: 16px 22px; box-shadow: 0 2px 12px rgba(27,42,65,.15); }
  header h1 { margin: 0; font-size: 19px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: .01em; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; flex: 1; min-width: 340px; box-shadow: 0 1px 2px rgba(27,42,65,.04), 0 10px 30px -14px rgba(27,42,65,.18); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  button { cursor: pointer; font-weight: 600; border: 1.5px solid var(--line); background: #fff; color: var(--primary); padding: 8px 13px; border-radius: 9px; font-size: 13px; transition: 0.15s;}
  button:hover { border-color: var(--brass-lt); }
  button.danger { color: var(--accent); border-color: var(--accent); }
  button.primary { background: linear-gradient(180deg, var(--primary-2), var(--primary)); color: #fdfbf6; border-color: var(--primary); box-shadow: 0 6px 14px -8px rgba(27,42,65,.5); }

  input[type=text], input[type=number], select, textarea {
    border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(169,125,61,.15); }
  label { font-size: 12px; font-weight: 700; color: var(--primary-2); display: block; margin-bottom: 2px; }

  .row-grid { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); margin-bottom: 12px; }

  .entry { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; position: relative; background: #fafaf5; }

  .section { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; background: #fff; overflow:hidden; transition: 0.2s; }
  .section.over { border: 2px dashed var(--brass); opacity: 0.7; }
  .drag-handle { cursor: grab; font-size: 18px; color: #9a9284; padding-right: 8px; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .section-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f6f2e7; flex-wrap: wrap; gap: 8px;}
  .section-body { padding: 12px; display: none; }
  .section.open .section-body { display: block; }
  .toggle-chevron { cursor: pointer; font-size: 13px; color: var(--primary-2); user-select: none; padding: 2px 6px; border-radius: 6px; transition: transform 0.15s; }
  .toggle-chevron:hover { background: rgba(169,125,61,.15); }
  .section.open .toggle-chevron { transform: rotate(90deg); }
  .localidade-item { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .localidade-item input { flex: 1; }

  /* ======== PREVIEW PÁGINA ÚNICA (paisagem) ======== */
  #previewHost { flex: 1.5; position: sticky; top: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; min-width: 480px;}
  #previewScaleWrapper { flex: 1; overflow-y: auto; background: #525659; border: 1px solid var(--line); border-radius: 8px; padding: 10px 0; }
  #iframeSizer { display: flex; justify-content: center; overflow: hidden; width:100%; }

<body>
<header>
  <h1>Calendário dos Ensaios Locais</h1>
  <p>Cadastre a localidade e a regra semanal (ex: 3ª terça-feira). As datas de cada mês são calculadas automaticamente.</p>
</header>

<div class="wrap">
  <div class="panel" id="formPanel">
    <div class="toolbar">
      <button class="primary" onclick="gerarPDF()">🖨️ Imprimir / PDF</button>
      <button onclick="exportJSON()">⬇️ Salvar Backup (.json)</button>
      <button onclick="document.getElementById('importInput').click()">⬆️ Carregar Backup</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
      <button id="btnListaSalvar" onclick="salvarLista()">☁️ Salvar</button>
      <button id="btnListaCarregar" onclick="carregarLista()">☁️ Carregar</button>
      <button class="danger" onclick="if(confirm('Limpar tudo?')) resetAll()">🗑️ Limpar Tudo</button>
    </div>

    <div class="row-grid" style="grid-template-columns: 2fr 1fr 1fr;">
      <div><label>Título</label><input type="text" id="meta_titulo" oninput="updateMeta('titulo', this.value)"></div>
      <div><label>Região/Subtítulo</label><input type="text" id="meta_subtitulo" placeholder="CAMPO MOURÃO - PR" oninput="updateMeta('subtitulo', this.value)"></div>
      <div><label>Ano</label><input type="number" id="meta_ano" placeholder="2026" oninput="updateMeta('ano', this.value)"></div>
    </div>
    <div class="row-grid" style="grid-template-columns: 1.4fr 1fr 2fr;">
      <div><label>Mês inicial (para atualizações no meio do ano)</label>
        <select id="meta_mesInicial" onchange="updateMeta('mesInicial', this.value)"></select>
      </div>
      <div><label>Horário padrão</label><input type="text" id="meta_horarioPadrao" placeholder="19:30" oninput="updateMeta('horarioPadrao', this.value)"></div>
      <div><label>Atualizado em (rodapé)</label><input type="text" id="meta_atualizado" placeholder="julho/2026" oninput="updateMeta('atualizado', this.value)"></div>
    </div>

    <div style="margin-bottom: 10px; padding-top: 6px; border-top: 1px solid var(--line);">
      <button onclick="addSecao()">+ Adicionar Seção (regra do dia)</button>
    </div>

    <div id="secoesContainer"></div>
  </div>

  <div class="panel" id="previewHost">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;color:var(--primary)">Pré-visualização (Folha A4 paisagem)</h3>
    </div>
    <div id="previewScaleWrapper">
      <div id="iframeSizer">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
const DIAS_SEMANA = [
  { valor: 0, nome: 'Domingo', genero: 'º' },
  { valor: 1, nome: 'Segunda-feira', genero: 'ª' },
  { valor: 2, nome: 'Terça-feira', genero: 'ª' },
  { valor: 3, nome: 'Quarta-feira', genero: 'ª' },
  { valor: 4, nome: 'Quinta-feira', genero: 'ª' },
  { valor: 5, nome: 'Sexta-feira', genero: 'ª' },
  { valor: 6, nome: 'Sábado', genero: 'º' }
];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_EXTENSO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

let STATE = {
  meta: {
    titulo: "CALENDÁRIO DOS ENSAIOS LOCAIS",
    subtitulo: "",
    ano: "",
    mesInicial: 1,
    horarioPadrao: "19:30",
    atualizado: ""
  },
  secoes: []
};

function updateMeta(key, val) {
  STATE.meta[key] = val;
  updatePreview();
  saveData();
}

function addSecao() {
  STATE.secoes.push({ ordinal: 1, diaSemana: 1, isOpen: true, localidades: [] });
  renderSecoes(); updatePreview(); saveData();
}

function ordinalTexto(ordinal, diaSemanaValor) {
  const dia = DIAS_SEMANA.find(d => d.valor === Number(diaSemanaValor)) || DIAS_SEMANA[1];
  if (ordinal === 'ultima') return dia.genero === 'o' ? 'Último' : 'Última';
  return `${ordinal}${dia.genero}`;
}

function rotuloSecao(secao) {
  const dia = DIAS_SEMANA.find(d => d.valor === Number(secao.diaSemana)) || DIAS_SEMANA[1];
  return `${ordinalTexto(secao.ordinal, secao.diaSemana)} ${dia.nome}`;
}

let dragSrcEl = null;

function renderSecoes() {
  const container = document.getElementById('secoesContainer');
  container.innerHTML = '';

  STATE.secoes.forEach((secao, sIdx) => {
    if (typeof secao.isOpen === 'undefined') secao.isOpen = true;
    if (!secao.localidades) secao.localidades = [];

    const secDiv = document.createElement('div');
    secDiv.className = secao.isOpen ? 'section open' : 'section';
    secDiv.draggable = true;
    secDiv.dataset.index = sIdx;

    secDiv.addEventListener('dragstart', function (e) {
      dragSrcEl = this;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', this.innerHTML);
      this.style.opacity = '0.4';
    });
    secDiv.addEventListener('dragover', function (e) {
      if (e.preventDefault) e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    });
    secDiv.addEventListener('dragenter', function () { this.classList.add('over'); });
    secDiv.addEventListener('dragleave', function () { this.classList.remove('over'); });
    secDiv.addEventListener('drop', function (e) {
      if (e.stopPropagation) e.stopPropagation();
      if (dragSrcEl !== this) {
        const fromIdx = parseInt(dragSrcEl.dataset.index);
        const toIdx = parseInt(this.dataset.index);
        const moved = STATE.secoes.splice(fromIdx, 1)[0];
        STATE.secoes.splice(toIdx, 0, moved);
        renderSecoes(); updatePreview(); saveData();
      }
      return false;
    });
    secDiv.addEventListener('dragend', function () {
      this.style.opacity = '1';
      document.querySelectorAll('.section').forEach(el => el.classList.remove('over'));
    });

    // Cabeçalho da seção
    const head = document.createElement('div');
    head.className = 'section-head';

    const titleWrap = document.createElement('div');
    titleWrap.style.cssText = 'display:flex; gap:8px; align-items:center; flex:1;';
    titleWrap.innerHTML = `<span class="drag-handle" title="Arraste para reordenar">☰</span><b id="rotulo-secao-${sIdx}">${sIdx + 1}. ${rotuloSecao(secao).toUpperCase()}</b>`;

    const controls = document.createElement('div');
    controls.style.cssText = 'display:flex; gap:4px; align-items:center;';

    const toggleBtn = document.createElement('span');
    toggleBtn.className = 'toggle-chevron';
    toggleBtn.textContent = '▸';
    toggleBtn.title = 'Mostrar/ocultar';
    toggleBtn.onclick = () => { secao.isOpen = !secao.isOpen; renderSecoes(); saveData(); };
    controls.appendChild(toggleBtn);

    const rmBtn = document.createElement('button'); rmBtn.className = 'danger'; rmBtn.textContent = 'Excluir Seção';
    rmBtn.onclick = () => { if (confirm('Excluir esta seção e suas localidades?')) { STATE.secoes.splice(sIdx, 1); renderSecoes(); updatePreview(); saveData(); } };
    controls.appendChild(rmBtn);

    head.appendChild(titleWrap);
    head.appendChild(controls);
    secDiv.appendChild(head);

    // Corpo da seção
    const body = document.createElement('div');
    body.className = 'section-body';

    const grid = document.createElement('div');
    grid.className = 'row-grid'; grid.style.gridTemplateColumns = '1fr 1.4fr'; grid.style.marginBottom = '10px';

    const atualizarRotulo = () => {
      const el = document.getElementById(`rotulo-secao-${sIdx}`);
      if (el) el.textContent = `${sIdx + 1}. ${rotuloSecao(secao).toUpperCase()}`;
    };

    const fOrdinal = document.createElement('div');
    fOrdinal.innerHTML = '<label>Qual (ordem no mês)</label>';
    const sOrdinal = document.createElement('select');
    [1,2,3,4,5,'ultima'].forEach(n => {
      const opt = document.createElement('option'); opt.value = n; opt.textContent = ordinalTexto(n, secao.diaSemana);
      if (String(secao.ordinal) === String(n)) opt.selected = true;
      sOrdinal.appendChild(opt);
    });
    sOrdinal.onchange = (e) => { secao.ordinal = e.target.value === 'ultima' ? 'ultima' : Number(e.target.value); atualizarRotulo(); updatePreview(); saveData(); };
    fOrdinal.appendChild(sOrdinal); grid.appendChild(fOrdinal);

    const fDia = document.createElement('div');
    fDia.innerHTML = '<label>Dia da semana</label>';
    const sDia = document.createElement('select');
    DIAS_SEMANA.forEach(d => {
      const opt = document.createElement('option'); opt.value = d.valor; opt.textContent = d.nome;
      if (Number(secao.diaSemana) === d.valor) opt.selected = true;
      sDia.appendChild(opt);
    });
    sDia.onchange = (e) => {
      secao.diaSemana = Number(e.target.value);
      Array.from(sOrdinal.options).forEach(opt => { opt.textContent = ordinalTexto(opt.value, secao.diaSemana); });
      atualizarRotulo();
      updatePreview(); saveData();
    };
    fDia.appendChild(sDia); grid.appendChild(fDia);

    body.appendChild(grid);

    const listaLocalidades = document.createElement('div');
    secao.localidades.forEach((loc, lIdx) => {
      const item = document.createElement('div');
      item.className = 'localidade-item';

      const iNome = document.createElement('input'); iNome.type = 'text'; iNome.placeholder = 'Ex: Campo Mourão - Central'; iNome.value = loc.nome || '';
      iNome.oninput = (e) => { loc.nome = e.target.value; updatePreview(); saveData(); };

      const iHorario = document.createElement('input'); iHorario.type = 'text'; iHorario.placeholder = STATE.meta.horarioPadrao || '19:30'; iHorario.style.flex = '0 0 90px'; iHorario.value = loc.horario || '';
      iHorario.oninput = (e) => { loc.horario = e.target.value; updatePreview(); saveData(); };

      const sPeriodicidade = document.createElement('select');
      sPeriodicidade.style.flex = '0 0 118px';
      [['todos','Todos os meses'], ['impares','Ímpares'], ['pares','Pares']].forEach(([val, label]) => {
        const opt = document.createElement('option'); opt.value = val; opt.textContent = label;
        if ((loc.periodicidade || 'todos') === val) opt.selected = true;
        sPeriodicidade.appendChild(opt);
      });
      sPeriodicidade.onchange = (e) => { loc.periodicidade = e.target.value; updatePreview(); saveData(); };

      const rm = document.createElement('button'); rm.className = 'danger'; rm.textContent = '✕';
      rm.onclick = () => { secao.localidades.splice(lIdx, 1); renderSecoes(); updatePreview(); saveData(); };

      item.appendChild(iNome); item.appendChild(iHorario); item.appendChild(sPeriodicidade); item.appendChild(rm);
      listaLocalidades.appendChild(item);
    });
    body.appendChild(listaLocalidades);

    const addLocBtn = document.createElement('button'); addLocBtn.textContent = '+ Adicionar Localidade'; addLocBtn.style.marginTop = '4px';
    addLocBtn.onclick = () => { secao.localidades.push({ nome: '', horario: '', periodicidade: 'todos' }); renderSecoes(); updatePreview(); saveData(); };
    body.appendChild(addLocBtn);

    secDiv.appendChild(body);
    container.appendChild(secDiv);
  });
}

/* Calcula o dia do mês (1-31) da Nª ocorrência de um dia da semana no mês/ano dados.
   Retorna null se essa ocorrência não existir naquele mês (ex: 5ª sexta-feira). */
function nthWeekdayOfMonth(ano, mes, diaSemana, n) {
  const primeiro = new Date(ano, mes - 1, 1);
  const primeiroDiaSemana = primeiro.getDay();
  const diff = (Number(diaSemana) - primeiroDiaSemana + 7) % 7;
  const dia = 1 + diff + (n - 1) * 7;
  const diasNoMes = new Date(ano, mes, 0).getDate();
  if (dia > diasNoMes) return null;
  return dia;
}

/* Calcula o dia da ÚLTIMA ocorrência de um dia da semana no mês/ano dados
   (ex: última quinta-feira do mês, exista ou não uma 5ª semana). */
function lastWeekdayOfMonth(ano, mes, diaSemana) {
  const ultimoDia = new Date(ano, mes, 0).getDate();
  const ultimoDiaSemana = new Date(ano, mes - 1, ultimoDia).getDay();
  const diff = (ultimoDiaSemana - Number(diaSemana) + 7) % 7;
  return ultimoDia - diff;
}

function mesAplica(periodicidade, mes) {
  if (periodicidade === 'pares') return mes % 2 === 0;
  if (periodicidade === 'impares') return mes % 2 !== 0;
  return true;
}

/* Gera a sequência de 12 meses a partir do mês inicial escolhido.
   Quando passa de dezembro, "vira" para o ano seguinte (anoOffset = 1). */
/* Gera a sequência de meses do mês inicial escolhido até dezembro do
   mesmo ano (não avança para o ano seguinte). */
function sequenciaMeses(mesInicial) {
  const seq = [];
  for (let mes = mesInicial; mes <= 12; mes++) {
    seq.push({ mes, anoOffset: 0 });
  }
  return seq;
}

function calcularLinha(regra, ano, seqMeses) {
  return seqMeses.map(({ mes, anoOffset }) => {
    if (!mesAplica(regra.periodicidade, mes)) return 'X';
    const dia = regra.ordinal === 'ultima'
      ? lastWeekdayOfMonth(ano + anoOffset, mes, regra.diaSemana)
      : nthWeekdayOfMonth(ano + anoOffset, mes, regra.diaSemana, regra.ordinal);
    return (dia === null || typeof dia === 'undefined') ? 'X' : String(dia);
  });
}

function escapeHTML(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Recebe uma matriz [localidade][mes] = valor (string do dia ou 'X') e
   devolve um "plano" de células: para cada posição, ou null (célula já
   coberta por uma mesclagem anterior, não deve gerar <td>) ou um objeto
   {val, colspan, rowspan} descrevendo o bloco retangular a desenhar ali.
   Isso permite mesclar tanto na horizontal (meses seguidos com o mesmo
   dia) quanto na vertical (localidades diferentes que caem no mesmo dia
   naquele(s) mês(es)) - inclusive quando as localidades têm periodicidades
   diferentes (ímpares/pares) e só coincidem em alguns meses específicos. */
function planoCelulasMescladas(grid) {
  const numLinhas = grid.length;
  const numCols = numLinhas ? grid[0].length : 0;
  const coberto = Array.from({ length: numLinhas }, () => new Array(numCols).fill(false));
  const plano = Array.from({ length: numLinhas }, () => new Array(numCols).fill(null));

  for (let r = 0; r < numLinhas; r++) {
    for (let c = 0; c < numCols; c++) {
      if (coberto[r][c]) continue;
      const val = grid[r][c];

      let colspan = 1;
      while (c + colspan < numCols && !coberto[r][c + colspan] && grid[r][c + colspan] === val) colspan++;

      let rowspan = 1;
      linhaLoop:
      while (r + rowspan < numLinhas) {
        for (let cc = c; cc < c + colspan; cc++) {
          if (coberto[r + rowspan][cc] || grid[r + rowspan][cc] !== val) break linhaLoop;
        }
        rowspan++;
      }

      for (let rr = r; rr < r + rowspan; rr++) {
        for (let cc = c; cc < c + colspan; cc++) coberto[rr][cc] = true;
      }
      plano[r][c] = { val, colspan, rowspan };
    }
  }
  return plano;
}

function celulasDaLinhaComPlano(plano, r, numCols) {
  let html = '';
  for (let c = 0; c < numCols; c++) {
    const cell = plano[r][c];
    if (!cell) continue; // coberto por mesclagem de uma célula anterior
    const attrs = [];
    if (cell.colspan > 1) attrs.push(`colspan="${cell.colspan}"`);
    if (cell.rowspan > 1) attrs.push(`rowspan="${cell.rowspan}"`);
    html += `<td${attrs.length ? ' ' + attrs.join(' ') : ''} class="${cell.val === 'X' ? 'col-x' : ''}">${cell.val}</td>`;
  }
  return html;
}

function buildDocumentHTML() {
  const m = STATE.meta;
  const ano = parseInt(m.ano, 10) || new Date().getFullYear();
  const horarioPadrao = (m.horarioPadrao || '19:30').trim();
  const mesInicial = Number(m.mesInicial) || 1;
  const seqMeses = sequenciaMeses(mesInicial);
  const colTotal = seqMeses.length + 1;

  const cabecalhoMeses = seqMeses.map(({ mes, anoOffset }) => `<th>${MESES[mes - 1]}${anoOffset ? '/' + String(ano + anoOffset).slice(2) : ''}</th>`).join('');
  const theadHtml = `<thead><tr><th class="th-nome">Localidade</th>${cabecalhoMeses}</tr></thead>`;

  // Cada seção representa uma regra de "qual dia da semana" (ex: 3ª terça-
  // feira). A periodicidade (todos/ímpares/pares) é escolhida por
  // localidade, então cada linha pode ter um resultado de dias diferente.
  // As células dos meses são mescladas célula a célula: sempre que o
  // mesmo dia se repetir entre localidades vizinhas (mesmo que uma seja
  // ímpar e outra par) e/ou entre meses seguidos, a mesclagem acontece -
  // mesmo que o resto da linha não coincida.
  let tabelasHtml = '';
  STATE.secoes.forEach(secao => {
    if (!secao.localidades || secao.localidades.length === 0) return;

    const rotuloRegra = rotuloSecao(secao).toUpperCase();
    let linhasGrupo = `<tr><td colspan="${colTotal}" class="regra-row">${escapeHTML(rotuloRegra)}</td></tr>`;

    const grid = secao.localidades.map(loc =>
      calcularLinha({ ordinal: secao.ordinal, diaSemana: secao.diaSemana, periodicidade: loc.periodicidade || 'todos' }, ano, seqMeses)
    );
    const plano = planoCelulasMescladas(grid);

    secao.localidades.forEach((loc, r) => {
      const horarioLoc = (loc.horario || '').trim();
      const nomeExibido = horarioLoc && horarioLoc !== horarioPadrao
        ? `${escapeHTML(loc.nome)} (${escapeHTML(horarioLoc)}h)`
        : escapeHTML(loc.nome);
      linhasGrupo += `<tr><td class="col-nome">${nomeExibido}</td>`;
      linhasGrupo += celulasDaLinhaComPlano(plano, r, seqMeses.length);
      linhasGrupo += `</tr>`;
    });

    tabelasHtml += `<div class="grupo-tabela"><table class="cal-table">${theadHtml}<tbody>${linhasGrupo}</tbody></table></div>`;
  });

  const totalLocalidades = STATE.secoes.reduce((acc, s) => acc + (s.localidades ? s.localidades.length : 0), 0);
  if (totalLocalidades === 0) {
    tabelasHtml = `<table class="cal-table">${theadHtml}<tbody><tr><td colspan="${colTotal}" style="padding:10px; color:#666;">(Nenhuma localidade adicionada)</td></tr></tbody></table>`;
  }

  // Observação fixa sobre o horário padrão, mostrada no topo. As exceções de horário
  // já aparecem "explícitas" ao lado do nome da localidade (ex: "Roncador (20h)").
  const obsHorario = `Obs. Os ensaios locais são realizados às ${escapeHTML(horarioPadrao)} hs, com exceção das que estão explícitas.`;

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHTML(m.titulo)}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght=400;700&display=swap');

    @page { size: A4 portrait; margin: 0; }
    html, body { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: #000; font-size: 9.5px;
      width: 210mm;
      margin: 0 auto;
    }

    .list-wrapper {
      position: relative;
      height: 285mm;
      min-height: 285mm;
      padding: 6mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-border {
      position: absolute;
      inset: 0;
      margin: 5mm;
      border: 1px solid #262626;
      pointer-events: none;
      box-sizing: border-box;
    }

    .doc-header { text-align: center; margin-bottom: 4px; }
    .doc-header .ttl { font-weight: bold; font-size: 13px; }
    .doc-header .subttl { font-weight: bold; font-size: 11px; margin-top: 2px; }

    .obs-topo { font-size: 9px; font-weight: bold; text-align: center; margin-bottom: 8px; }

    table.cal-table { width: 100%; table-layout: fixed; border-collapse: collapse; border: 1px solid #262626; }
    .tabelas-wrapper { flex: 1; min-height: 0; overflow: hidden; }
    table.cal-table th, table.cal-table td { border: 1px solid #262626; padding: 2px 3px; text-align: center; vertical-align: middle; overflow-wrap: break-word; }
    table.cal-table th { font-weight: bold; background: #eee; font-size: 9px; padding: 0px 3px; line-height: 1.1; }
    table.cal-table th.th-nome { width: 52mm; }
    table.cal-table td.col-nome { text-align: center; font-weight: bold; white-space: nowrap; }
    table.cal-table td.col-x { color: #999; }
    table.cal-table td.regra-row { text-align: center; background: #d9d9d9; color: #000; font-weight: bold; font-size: 10px; letter-spacing: .02em; padding: 2px 4px; }
    .grupo-tabela { margin-bottom: 2mm; break-inside: avoid; page-break-inside: avoid; }
    .grupo-tabela:last-child { margin-bottom: 0; }

    .rodape { text-align: right; margin-top: 6px; font-size: 9px; font-style: italic; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style></head>
  <body>
    <div class="list-wrapper">
      <div class="page-border"></div>
      <div class="doc-header">
        <div class="ttl">${escapeHTML(m.titulo)}${m.subtitulo ? ' - ' + escapeHTML(m.subtitulo) : ''} - ${ano}</div>
      </div>

      <div class="obs-topo">${obsHorario}</div>

      <div class="tabelas-wrapper">${tabelasHtml}</div>

      <div class="rodape">${m.atualizado ? 'Atualizado ' + escapeHTML(m.atualizado) : ''}</div>
    </div>
  </body></html>`;
}

/* ================= ENGINE DA PREVIEW ================= */
function updatePreview() {
  const html = buildDocumentHTML();
  const frame = document.getElementById('previewFrame');
  const doc = frame.contentDocument;

  if (doc && doc.body && doc.body.innerHTML.trim() !== "") {
    const parser = new DOMParser();
    const newDoc = parser.parseFromString(html, 'text/html');

    doc.title = newDoc.title;

    if (doc.head && newDoc.head) {
      doc.head.innerHTML = newDoc.head.innerHTML;
    }

    doc.body.innerHTML = newDoc.body.innerHTML;

    scalePreview();
  } else {
    frame.srcdoc = html;
    setTimeout(scalePreview, 100);
  }
}

function scalePreview() {
  const wrapper = document.getElementById('previewScaleWrapper');
  const sizer = document.getElementById('iframeSizer');
  const iframe = document.getElementById('previewFrame');
  if (!wrapper || !sizer || !iframe) return;

  iframe.style.transform = 'scale(1)';
  const scale = Math.min(1, wrapper.clientWidth / 794);
  iframe.style.transform = `scale(${scale})`;
  sizer.style.height = `${iframe.contentWindow.document.body.scrollHeight * scale}px`;
}

/* ================= FUNÇÕES DE APOIO ================= */
function gerarPDF() {
  const html = buildDocumentHTML();
  const w = window.open('', '_blank');
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 400);
}

function saveData() { localStorage.setItem('ccb_calendario_ensaios_state', JSON.stringify(STATE)); }
function loadData() {
  try {
    const raw = localStorage.getItem('ccb_calendario_ensaios_state');
    if(raw) STATE = JSON.parse(raw);
  } catch(e) {}
}

function saveState() { saveData(); }

function loadStateFromJSON(text) {
  try { STATE = JSON.parse(text); init(); return true; } catch(e) { alert('Arquivo inválido.'); return false; }
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'calendario_ensaios.json'; a.click();
}

function importJSON(ev) {
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { loadStateFromJSON(reader.result); };
  reader.readAsText(file);
}

function resetAll() {
  STATE = {
    meta: {
      titulo: "CALENDÁRIO DOS ENSAIOS LOCAIS",
      subtitulo: "",
      ano: "",
      mesInicial: 1,
      horarioPadrao: "19:30",
      atualizado: ""
    },
    secoes: []
  };
  init(); saveData();
}

function init() {
  document.getElementById('meta_titulo').value = STATE.meta.titulo || '';
  document.getElementById('meta_subtitulo').value = STATE.meta.subtitulo || '';
  document.getElementById('meta_ano').value = STATE.meta.ano || '';
  document.getElementById('meta_horarioPadrao').value = STATE.meta.horarioPadrao || '19:30';
  document.getElementById('meta_atualizado').value = STATE.meta.atualizado || '';

  const selMes = document.getElementById('meta_mesInicial');
  selMes.innerHTML = '';
  MESES_EXTENSO.forEach((nome, idx) => {
    const opt = document.createElement('option');
    opt.value = idx + 1;
    opt.textContent = nome.charAt(0).toUpperCase() + nome.slice(1);
    if (Number(STATE.meta.mesInicial || 1) === idx + 1) opt.selected = true;
    selMes.appendChild(opt);
  });

  renderSecoes();
  updatePreview();
}

window.onload = () => {
  loadData();
  init();
  window.addEventListener('resize', scalePreview);
  setTimeout(scalePreview, 300);
};
</script>
<script>
(function () {
  var REGIAO = 'calendario';

  function tokenAtual() {
    return localStorage.getItem('session_token');
  }

  function sugerirNomeArquivo() {
    var d = new Date().toISOString().slice(0, 10);
    return REGIAO + '_' + d;
  }

  window.salvarLista = async function () {
    var btn = document.getElementById('btnListaSalvar');
    var nome = prompt('Nome para salvar este calendário:', sugerirNomeArquivo());
    if (nome === null) return; // cancelou
    if (btn) { btn.disabled = true; btn.textContent = '☁️ Salvando...'; }
    try {
      saveState();
      var conteudo = JSON.stringify(STATE, null, 2);
      var res = await fetch('/api/lista-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tokenAtual(), regiao: REGIAO, nome: nome, conteudo: conteudo })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao salvar');
      alert('Calendário salvo como: ' + data.nomeArquivo);
    } catch (e) {
      alert('Erro ao salvar: ' + e.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '☁️ Salvar'; }
    }
  };

  window.carregarLista = async function () {
    var btn = document.getElementById('btnListaCarregar');
    if (btn) { btn.disabled = true; btn.textContent = '☁️ Carregando...'; }
    try {
      var res = await fetch('/api/lista-list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tokenAtual(), regiao: REGIAO })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao listar arquivos');
      if (!data.arquivos.length) { alert('Ainda não existe nenhum calendário salvo.'); return; }
      mostrarSeletorListas(data.arquivos);
    } catch (e) {
      alert('Erro ao acessar os calendários salvos: ' + e.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '☁️ Carregar'; }
    }
  };

  function mostrarSeletorListas(arquivos) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99999; display:flex; align-items:center; justify-content:center;';
    var box = document.createElement('div');
    box.style.cssText = 'background:#fff; border-radius:10px; padding:20px; width:340px; max-height:70vh; overflow:auto; font-family:Arial, Helvetica, sans-serif;';
    box.innerHTML = '<h3 style="margin:0 0 12px; font-size:16px;">Escolha o arquivo</h3>';

    arquivos.forEach(function (f) {
      var item = document.createElement('button');
      item.textContent = f.nome;
      item.style.cssText = 'display:block; width:100%; text-align:left; padding:9px 10px; margin-bottom:6px; border:1px solid #ccd3da; border-radius:6px; background:#f4f6f8; cursor:pointer; font-size:13px;';
      item.onclick = async function () {
        overlay.remove();
        try {
          var res = await fetch('/api/lista-load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenAtual(), regiao: REGIAO, nome: f.nome })
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erro ao carregar');
          loadStateFromJSON(data.conteudo);
        } catch (e) {
          alert('Erro ao carregar arquivo: ' + e.message);
        }
      };
      box.appendChild(item);
    });

    var cancelar = document.createElement('button');
    cancelar.textContent = 'Cancelar';
    cancelar.style.cssText = 'display:block; width:100%; text-align:center; padding:9px 10px; margin-top:6px; border:1px solid #ccd3da; border-radius:6px; background:#fff; cursor:pointer; font-size:13px;';
    cancelar.onclick = function () { overlay.remove(); };
    box.appendChild(cancelar);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
})();
</script>
</body>
