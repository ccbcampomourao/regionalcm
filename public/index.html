<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando...</title>
<script src="/assets/ui.js"></script>
</head>
<body>
<script>
// Leva cada pessoa direto para o lugar certo:
// admin -> painel; uma lista só -> essa lista; várias -> "Minhas listas".
// A assinatura do token é conferida de novo pela própria página de destino.
(function () {
  var s = UI.sessao();
  if (!s) localStorage.removeItem('session_token');
  window.location.replace(UI.destino(s));
})();
</script>
</body>
</html>
