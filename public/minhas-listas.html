<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas listas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>body.theme{visibility:hidden;}</style>
</head>
<body class="theme">
<header class="topbar">
  <div class="brandmark">
    <img src="/assets/regionalcmlogo.png" alt="CCB" style="height:35px;">
    <h1>Minhas listas</h1>
  </div>
  <a href="#" id="btnSair" class="btn-ghost">Sair</a>
</header>
<main class="cat">
  <div class="cat-intro">
    <h2>O que você quer abrir?</h2>
    <p>Estas são as listas e calendários liberados para a sua conta.</p>
  </div>
  <div id="conteudo"></div>
  <p class="empty" id="empty" style="display:none;">Você ainda não tem nenhuma lista liberada. Fale com um administrador.</p>
</main>

<script>
const PIN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.1 7-12.5A7 7 0 0 0 5 9.5C5 14.9 12 22 12 22Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>';
const CAL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const GLOBE = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3Z" stroke="currentColor" stroke-width="1.7"/></svg>';
const ARROW = '<svg class="lgo" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const CATALOGO = {
  regional:        { url: '/listaregional.html',     label: 'Regional',                    tipo: 'regional' },
  campomourao:     { url: '/listacampomourao.html',  label: 'Campo Mourão',                tipo: 'local' },
  cianorte:        { url: '/listacianorte.html',     label: 'Cianorte',                    tipo: 'local' },
  ubirata:         { url: '/listaubirata.html',      label: 'Ubiratã',                     tipo: 'local' },
  pitanga:         { url: '/listapitanga.html',      label: 'Pitanga',                     tipo: 'local' },
  goioere:         { url: '/listagoioere.html',      label: 'Goioerê',                     tipo: 'local' },
  ivaipora:        { url: '/listaivaipora.html',     label: 'Ivaiporã',                    tipo: 'local' },
  calendario:      { url: '/calendario-ensaios.html',label: 'Calendário dos Ensaios',      tipo: 'cal', desc: 'Ensaios locais da regional' },
  calendarioanual: { url: '/calendario-reunioes.html',label: 'Calendário Anual de Reuniões',tipo: 'cal', desc: 'Reuniões do ano, com capa, legenda e feriados' }
};

document.getElementById('btnSair').addEventListener('click', function (e) {
  e.preventDefault();
  localStorage.removeItem('session_token');
  window.location.href = '/login.html';
});

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

function cardHTML(c) {
  const cal = c.tipo === 'cal';
  return '<a class="lcard' + (cal ? ' cal' : '') + '" href="' + c.url + '">' +
    '<div class="lic">' + (cal ? CAL : PIN) + '</div>' +
    '<div class="ltx"><div class="lnm">' + esc(c.label) + '</div><div class="lds">' + esc(c.desc || 'Lista de serviços da localidade') + '</div></div>' +
    ARROW + '</a>';
}

function bloco(titulo, itens, wide) {
  if (!itens.length) return '';
  return '<section class="blk"><div class="blk-head"><h3>' + titulo + '</h3><span class="qt">' + itens.length + '</span></div>' +
    '<div class="lcards' + (wide ? ' wide' : '') + '">' + itens.map(cardHTML).join('') + '</div></section>';
}

function renderListas(lists) {
  const itens = (lists || []).filter(function (k) { return CATALOGO[k]; }).map(function (k) { return CATALOGO[k]; });
  if (!itens.length) { document.getElementById('empty').style.display = 'block'; return; }
  const reg = itens.filter(function (c) { return c.tipo === 'regional'; })[0];
  const locais = itens.filter(function (c) { return c.tipo === 'local'; });
  const cals = itens.filter(function (c) { return c.tipo === 'cal'; });
  let html = '';
  if (reg) {
    html += '<section class="blk"><div class="blk-head"><h3>Regional</h3></div>' +
      '<a class="feat" href="' + reg.url + '"><div class="ficon">' + GLOBE + '</div>' +
      '<div class="ftx"><h4>Lista Regional</h4><p>Lista de serviços de toda a regional, reunindo as localidades.</p></div>' +
      '<span class="go">Abrir lista</span></a></section>';
  }
  html += bloco('Listas por localidade', locais, false);
  html += bloco('Calendários', cals, true);
  document.getElementById('conteudo').innerHTML = html;
}

(function () {
  const token = localStorage.getItem('session_token');
  if (!token) { window.location.replace('/login.html'); return; }
  fetch('/api/verify-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.ok) {
      document.body.style.visibility = 'visible';
      renderListas(data.lists);
    } else {
      localStorage.removeItem('session_token');
      window.location.replace('/login.html');
    }
  }).catch(function () {
    window.location.replace('/login.html');
  });
})();
</script>
</body>
</html>
